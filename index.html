<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>学程智伴 · 校园助手原型</title>
<style>
<!-- ===== S:CSS ===== -->
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#E9EAF2;color:#111827;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
:root{
  --main:#4F46E5; --danger:#EF4444; --warn:#F59E0B; --info:#3B82F6;
  --ok:#10B981; --sub:#6B7280; --bg:#F5F6FA; --line:#F0F1F5;
}
button,input,textarea,select{font-family:inherit;color:#111827}

/* ---------- 舞台 / 手机壳 ---------- */
.stage{display:flex;gap:26px;justify-content:center;padding:20px;min-height:100dvh;align-items:flex-start}
.phone{
  width:390px;height:844px;flex:0 0 390px;border-radius:44px;background:#fff;overflow:hidden;
  position:relative;border:10px solid #111827;box-shadow:0 18px 50px rgba(17,24,39,.28),0 0 0 2px #374151 inset;
}
.screen{height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:22px;
  background:#111827;border-radius:0 0 14px 14px;z-index:30;pointer-events:none
}
.appbar{
  flex:0 0 auto;height:56px;padding:22px 14px 0;display:flex;align-items:center;gap:8px;
  background:#fff;border-bottom:1px solid var(--line)
}
.appbar .ttl{font-size:17px;font-weight:700;letter-spacing:.2px}
.appbar .sp{flex:1}
.appbar .act{font-size:12px;color:var(--main);font-weight:600;cursor:pointer;padding:4px 2px}
.appbar .back{width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:-4px}
#view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:12px 14px 92px;-webkit-overflow-scrolling:touch}
#view::-webkit-scrollbar{width:0;height:0}
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:64px;background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);display:flex;z-index:25;
  padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)
}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--sub)}
.tabbar .tab svg{width:22px;height:22px}
.tabbar .tab span{font-size:11px;line-height:1.1}
.tabbar .tab.on{color:var(--main)}
.tabbar .tab.on svg{stroke-width:2.1}

/* ---------- 通用组件 ---------- */
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(17,24,39,.06);padding:14px}
.card+.card{margin-top:12px}
.sec{font-size:12px;color:var(--sub);font-weight:600;margin:16px 2px 8px}
.sec:first-child{margin-top:2px}
.desc{
  font-size:12px;color:#4B5563;background:#EEF2FF;border-radius:12px;padding:9px 11px;
  margin-bottom:12px;line-height:1.55
}
.desc b{color:var(--main)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row .ri{width:38px;height:38px;border-radius:11px;flex:0 0 38px;display:flex;align-items:center;justify-content:center}
.row .rt{flex:1;min-width:0}
.row .rt .t{font-size:14px;font-weight:600;line-height:1.35}
.row .rt .s{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4}
.row .rv{font-size:12px;color:var(--sub);text-align:right;flex:0 0 auto}
.row .rv b{color:#111827;font-size:13px}
.btn{
  width:100%;height:48px;border:none;border-radius:12px;background:var(--main);color:#fff;
  font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer
}
.btn.sub{background:#fff;color:#374151;border:1px solid #E5E7EB}
.btn.ghost{background:#F3F4F6;color:#374151}
.btn.danger{background:var(--danger)}
.btn.sm{height:40px;font-size:13px}
.btn:active{opacity:.85}
.btnrow{display:flex;gap:10px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 8px;border-radius:999px;background:#F3F4F6;color:var(--sub)}
.tag.main{background:#EEF2FF;color:var(--main)}
.tag.warn{background:#FEF3C7;color:#B45309}
.tag.danger{background:#FEE2E2;color:#B91C1C}
.tag.ok{background:#D1FAE5;color:#047857}
.tag.info{background:#DBEAFE;color:#1D4ED8}
.chev{flex:0 0 14px;color:#D1D5DB}
.seg{display:flex;background:#F3F4F6;border-radius:11px;padding:3px;gap:2px}
.seg>div{flex:1;text-align:center;font-size:12px;padding:7px 0;border-radius:9px;cursor:pointer;color:var(--sub);font-weight:500}
.seg>div.on{background:#fff;color:var(--main);font-weight:700;box-shadow:0 1px 4px rgba(17,24,39,.10)}
.pg{height:8px;border-radius:4px;background:#F3F4F6;overflow:hidden}
.pg i{display:block;height:100%;border-radius:4px;background:var(--main);transition:width .3s}
.sw{width:44px;height:26px;border-radius:13px;background:#E5E7EB;position:relative;flex:0 0 44px;cursor:pointer;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.sw.on{background:var(--main)}
.sw.on i{left:21px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:600}
.inp{
  width:100%;height:44px;border:1px solid #E5E7EB;border-radius:11px;padding:0 12px;font-size:14px;
  background:#fff;outline:none
}
.inp:focus{border-color:var(--main)}
textarea.inp{height:132px;padding:10px 12px;resize:vertical;line-height:1.5;font-size:12px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.empty{text-align:center;padding:44px 20px;color:var(--sub);font-size:12px}
.empty svg{opacity:.35;margin-bottom:8px}
.money{font-variant-numeric:tabular-nums}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.mid{font-size:20px;font-weight:700}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;color:var(--sub)}
.kv b{color:#111827;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(17,24,39,.05)}
.stat .n{font-size:19px;font-weight:800;line-height:1.2}
.stat .l{font-size:11px;color:var(--sub);margin-top:2px}

/* ---------- 子导航 / 悬浮按钮 / 下一件事 ---------- */
.subnav{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;-webkit-overflow-scrolling:touch}
.subnav::-webkit-scrollbar{height:0}
.subnav>div{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:#fff;font-size:12px;color:#6B7280;cursor:pointer;box-shadow:0 1px 4px rgba(17,24,39,.06);white-space:nowrap}
.subnav>div.on{background:var(--main);color:#fff;font-weight:700;box-shadow:none}
.fab{position:absolute;right:16px;bottom:88px;width:52px;height:52px;border-radius:18px;background:var(--main);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(79,70,229,.42);z-index:22;cursor:pointer}
.fab:active{transform:scale(.94)}
.nextup{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#4F46E5,#7C6CF0);color:#fff;border-radius:14px;padding:11px 12px;margin-bottom:12px}
.nextup .lb{font-size:11px;opacity:.85}
.nextup .tt{font-size:14px;font-weight:700;margin-top:1px;line-height:1.35}
.nextup .tm{font-size:11px;opacity:.9;margin-top:2px}

/* ---------- 日程 ---------- */
.wkhead{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:8px;padding:0 2px}
.wkhead .todaybtn{color:var(--main);font-weight:600;cursor:pointer;font-size:11px}
.wkarrow{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 4px rgba(17,24,39,.06)}
.days{display:flex;gap:5px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.days::-webkit-scrollbar{height:0}
.day{flex:0 0 46px;text-align:center;padding:8px 0 7px;border-radius:13px;background:#fff;cursor:pointer;color:var(--sub);font-size:11px;box-shadow:0 1px 4px rgba(17,24,39,.05)}
.day .d{font-size:16px;font-weight:800;color:#374151;margin-top:1px;line-height:1.2}
.day .dot{width:4px;height:4px;border-radius:50%;background:var(--main);margin:3px auto 0}
.day.on{background:var(--main);color:#fff;box-shadow:none}
.day.on .d{color:#fff}
.day.on .dot{background:#fff}
.ci{display:flex;gap:10px;background:#fff;border-radius:13px;padding:10px 11px;margin-bottom:8px;box-shadow:0 1px 5px rgba(17,24,39,.05);cursor:pointer}
.ci .bar{width:3px;border-radius:2px;flex:0 0 3px}
.ci .tm{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.ci .nm{font-size:14px;font-weight:600;margin-top:1px}
.ci .lc{font-size:11px;color:var(--sub);margin-top:2px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk .hd{text-align:center;font-size:10px;color:var(--sub);padding:4px 0}
.wk .hd b{display:block;font-size:12px;color:#374151;font-weight:700}
.wk .hd.on b{color:var(--main)}
.wk .col{min-height:118px;background:#fff;border-radius:10px;padding:4px 3px}
.wk .blk{font-size:9px;line-height:1.25;border-radius:6px;padding:4px 3px;margin-bottom:4px;color:#fff;overflow:hidden;cursor:pointer}
.wk .blk.none{background:transparent!important}
.wkgrid{background:#fff;border-radius:14px;padding:8px 6px 6px;box-shadow:0 2px 8px rgba(17,24,39,.05);
        display:grid;grid-template-columns:32px repeat(7,1fr);gap:3px}
.wkgrid .hd{text-align:center;font-size:10px;color:var(--sub);padding-bottom:5px}
.wkgrid .hd b{display:block;font-size:12px;color:#374151;font-weight:700;line-height:1.3}
.wkgrid .hd.on b{color:var(--main)}
.wkgrid .hd.on{color:var(--main)}
.wkgrid .ax{position:relative}
.wkgrid .ax i{position:absolute;right:2px;font-size:9px;color:#9CA3AF;font-style:normal;transform:translateY(-50%);
              font-variant-numeric:tabular-nums;white-space:nowrap}
.wkgrid .col{position:relative;border-left:1px solid #F0F1F5;border-radius:4px}
.wkgrid .col.on{background:#FBFBFE}
.wkgrid .hr{position:absolute;left:0;right:0;border-top:1px dashed #F1F2F6}
.wkgrid .ev{position:absolute;left:2px;right:2px;border-radius:7px;padding:3px 3px 2px;font-size:9px;line-height:1.22;
            color:#fff;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(17,24,39,.12);transition:transform .12s}
.wkgrid .ev:active{transform:scale(.96)}
.wkgrid .ev .n{font-weight:700;font-size:9.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkgrid .ev .p{opacity:.88;font-size:8px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkgrid .ev.dl{background:#FEF3C7!important;color:#B45309;border:1px dashed #FCD34D}
.bin{position:absolute;right:16px;bottom:150px;width:46px;height:46px;border-radius:16px;background:#fff;
     display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(17,24,39,.14);
     z-index:22;cursor:pointer;border:1px solid #ECECF2}
.bin:active{transform:scale(.94)}
.bin .bdg{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#EF4444;
          color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.emptyday{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:9px;color:#D1D5DB}

/* ---------- 图表 ---------- */
.donutwrap{display:flex;align-items:center;gap:14px}
.legend{flex:1;min-width:0}
.legend .li{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0}
.legend .li .dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.legend .li .nm{flex:1}
.legend .li .vl{color:var(--sub);font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:8px;height:104px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b .bar{width:100%;border-radius:5px 5px 0 0;background:#C7D2FE;min-height:3px;transition:height .3s}
.bars .b.hi .bar{background:var(--main)}
.bars .b .lb{font-size:10px;color:var(--sub)}

/* ---------- Forest ---------- */
.ringbox{position:relative;width:210px;height:210px;margin:6px auto 0}
.ringbox svg{transform:rotate(-90deg)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt .t1{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.ringtxt .t2{font-size:11px;color:var(--sub);margin-top:2px}
.treebox{display:flex;flex-direction:column;align-items:center;margin:6px 0 2px}
.treebox .stage-lb{font-size:11px;color:var(--sub);margin-top:4px}

/* ---------- 弹层 / Toast ---------- */
#layer{position:absolute;inset:0;z-index:50;pointer-events:none}
.mask{position:absolute;inset:0;background:rgba(17,24,39,.45);pointer-events:auto;display:flex;align-items:flex-end;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;background:#fff;border-radius:20px 20px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));
  animation:up .24s cubic-bezier(.2,.8,.3,1);max-height:86%;overflow-y:auto
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet .sh{display:flex;align-items:center;height:44px}
.sheet .sh .t{font-size:16px;font-weight:700;flex:1;text-align:center}
.sheet .sh .x{font-size:13px;color:var(--sub);cursor:pointer;width:44px;text-align:left}
.sheet .sh .k{width:44px}
.center-layer{position:absolute;inset:0;pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(17,24,39,.45);animation:fade .18s}
.dialog{width:100%;background:#fff;border-radius:18px;padding:20px 18px 16px;text-align:center;animation:pop .22s}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.dialog .dtitle{font-size:16px;font-weight:700;margin-bottom:6px}
.dialog .dbody{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:14px}
#toast{
  position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(6px);
  background:rgba(17,24,39,.93);color:#fff;font-size:13px;padding:10px 16px;border-radius:11px;
  z-index:80;opacity:0;pointer-events:none;transition:.22s;max-width:300px;text-align:center;line-height:1.5
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#rmdbar{position:absolute;left:12px;right:12px;top:10px;z-index:120;opacity:0;transform:translateY(-12px);transition:.24s;pointer-events:none}
#rmdbar.on{opacity:1;transform:translateY(0);pointer-events:auto}
.rmd{background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(17,24,39,.22);padding:11px 13px;display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--main);cursor:pointer}
.rmd .rt{flex:1;min-width:0}
.rmd .rt .t{font-size:13px;font-weight:700}
.rmd .rt .s{font-size:11px;color:#6B7280;margin-top:3px;line-height:1.65}
.rmd .x{font-size:11px;color:#9CA3AF;padding:3px 2px 3px 6px;flex:0 0 auto}
#gate{position:fixed;left:0;top:0;right:0;bottom:0;z-index:200;background:#F7F8FA;overflow:auto;display:none}
#gate.on{display:block}
.gate-wrap{max-width:460px;margin:0 auto;padding:22px 16px 40px;min-height:100%}
.gate-logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#4F46E5,#7C3AED);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.gate-h1{font-size:19px;font-weight:800;text-align:center}
.gate-sub{font-size:12px;color:#6B7280;text-align:center;margin-top:5px;line-height:1.7}
.gate-idcard{background:#fff;border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:11px;margin-top:16px;border:1px solid #EEF0F4}
.gate-foot{font-size:11px;color:#9CA3AF;line-height:1.8;margin-top:14px;text-align:center}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid #D1D5DB;flex:0 0 18px;display:flex;align-items:center;justify-content:center;background:#fff}
.chk.on{background:var(--main);border-color:var(--main)}
.itm{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.itm:last-child{border-bottom:none}
.errbox{background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:10px 12px;margin-top:10px}
.errbox .eh{font-size:12px;font-weight:700;color:#B91C1C;margin-bottom:4px}
.errbox .el{font-size:12px;color:#B91C1C;line-height:1.6;font-family:ui-monospace,Consolas,monospace}
.okbox{background:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:12px;color:#047857}

/* ---------- 桌面说明面板 ---------- */
.panel{
  width:330px;flex:0 0 330px;background:#fff;border-radius:18px;padding:18px 18px 20px;
  box-shadow:0 2px 14px rgba(17,24,39,.07);position:sticky;top:20px
}
.panel .logo{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel .logo .lg{width:32px;height:32px;border-radius:9px;background:var(--main);display:flex;align-items:center;justify-content:center}
.panel .logo b{font-size:15px}
.panel h3{font-size:13px;margin:14px 0 6px;color:var(--main)}
.panel p{font-size:12px;color:var(--sub);margin:0 0 8px;line-height:1.65}
.panel .step{display:flex;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px;line-height:1.5}
.panel .step:last-child{border-bottom:none}
.panel .step .tm{flex:0 0 46px;color:var(--main);font-weight:700;font-variant-numeric:tabular-nums}
.panel .step .tx{color:#4B5563}
.panel .tip{margin-top:12px;background:#FFF7ED;border-radius:10px;padding:9px 10px;font-size:11px;color:#B45309;line-height:1.6}
@media(max-width:880px){
  .panel{display:none}
  .phone{width:100%;height:100dvh;border-radius:0;border:none;box-shadow:none;flex:1 1 auto}
  .stage{padding:0;min-height:100dvh}
  .notch{display:none}
}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips>div{padding:7px 12px;border-radius:10px;background:#F3F4F6;font-size:12px;color:#6B7280;cursor:pointer}
.chips>div.on{background:var(--main);color:#fff;font-weight:700}
.cat{flex:1;text-align:center;padding:9px 0;border:1.5px solid #E5E7EB;border-radius:10px;font-size:13px;color:#6B7280;cursor:pointer;background:#fff;font-weight:500;transition:.15s}
.cat.on{border-color:transparent;color:#fff;font-weight:700}
<!-- ===== S:CSS:ANIM ===== -->
.anim-layer{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(17,24,39,.62);display:flex;align-items:center;justify-content:center;padding:24px;z-index:150;pointer-events:auto;cursor:pointer}
.anim-card{width:100%;max-width:330px;background:#fff;border-radius:20px;padding:14px 16px 14px;text-align:center;box-shadow:0 12px 40px rgba(17,24,39,.30);animation:cardIn .34s cubic-bezier(.2,.8,.3,1);pointer-events:auto;cursor:default;position:relative;overflow:hidden}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.anim-card .am{width:100%;height:170px;display:flex;align-items:center;justify-content:center}
.anim-card .am svg{width:170px;height:170px}
.anim-card .at{font-size:16px;font-weight:800;margin-top:2px}
.anim-card .as{font-size:12px;color:#6B7280;line-height:1.75;margin-top:6px}

   学程智伴 · 单文件原型

   技术约束：无框架、无构建、无 CDN、无外链字体，图标与图表全部内联 SVG
   ================================================================== */
<!-- ===== S:DATA ===== -->
/* ---------- 稳定的伪随机（保证不同设备打开看到同一份演示数据） ---------- */
var _seed = 20261017;
function rnd(){ _seed = (_seed * 9301 + 49297) % 233280; return _seed / 233280; }
function pick(arr){ return arr[Math.floor(rnd() * arr.length)]; }
function rint(a,b){ return Math.round(a + rnd() * (b - a)); }

/* ---------- 日期工具 ---------- */
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function dayOfWeek(d){ var w = d.getDay(); return w === 0 ? 7 : w; }   /* 1=周一 … 7=周日 */
function weekStart(d){ var x = new Date(d.getTime()); x.setDate(x.getDate() - (dayOfWeek(x) - 1)); x.setHours(0,0,0,0); return x; }
function monthKey(s){ return String(s).slice(0,7); }                    /* "2026-10" */
function curMonth(){ return monthKey(ymd(today())); }
function shiftMonth(mk,n){
  var y = +mk.slice(0,4), m = +mk.slice(5,7) - 1 + n;
  var d = new Date(y, m, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}
function daysInMonth(mk){ var y = +mk.slice(0,4), m = +mk.slice(5,7); return new Date(y, m, 0).getDate(); }
function money(n){
  var s = Math.abs(Number(n) || 0).toFixed(2).split('.');
  return s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + s[1];
}
function yuan(n){ return '¥' + money(n); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(p){ return (p || 'id') + '-' + Date.now().toString(36) + '-' + Math.floor(rnd()*1e5).toString(36); }

/* ---------- 账务五色 ---------- */
var CATS = [
  { key:'餐饮', color:'#F59E0B', icon:'bowl'  },
  { key:'学习', color:'#3B82F6', icon:'book'  },
  { key:'交通', color:'#06B6D4', icon:'bus'   },
  { key:'娱乐', color:'#8B5CF6', icon:'game'  },
  { key:'其他', color:'#6B7280', icon:'dots'  }
];
function catOf(k){ for (var i=0;i<CATS.length;i++){ if (CATS[i].key === k) return CATS[i]; } return CATS[4]; }

/* ---------- 预置流水库（打开「账单读取权限」时导入 10 条） ---------- */
function presetBills(){
  var t = today(), out = [], cz = ['食堂午餐','瑞幸咖啡','打印店打印','地铁通勤','超市日用品'];
  var cates = ['餐饮','餐饮','学习','交通','其他','餐饮','学习','交通','娱乐','其他'];
  for (var i = 0; i < 10; i++){
    out.push({
      id: 'auto-' + ymd(addDays(t, -1 - i)) + '-' + i,
      date: ymd(addDays(t, -1 - i)),
      amount: [18.5, 15, 6, 4, 32.8, 26, 89, 12, 45, 21.5][i],
      category: cates[i],
      note: cz[i % cz.length] + (i > 4 ? '（自动归类）' : ''),
      auto: true
    });
  }
  return out;
}

/* 大连北⇄盘锦 二等座真实票价档位（2026-10 携程口径）：D 字头 91/109，G 字头 135/138/146/154/162/169 */
var TRAIN_FARES = [109, 135, 138, 146, 154, 162, 169];

/* ---------- 账单金额口径（学生真实消费结构：餐饮 > 交通 > 学习 > 娱乐 > 其他） ---------- */
var BILL_RANGE = {
  '食堂早餐':[4,9],   '食堂午餐':[12,22], '食堂晚餐':[13,24], '早餐豆浆油条':[5,10],

  '外卖':[18,36],     '校园卡充值':[200,500],
  '打印复印':[3,20],  '文具':[15,60],    '教材费':[60,150],  '网课会员':[99,299], '实验报告装订':[5,15],
  '地铁通勤':[2,10],  '公交':[2,6],      '共享单车':[1.5,5], '打车':[18,60],      /* 大连北⇄盘锦 二等座真实票价（2026-10 携程口径）：D 字头 91/109，G 字头 135/138/146/154/162/169（常见 146） */
             '高铁回家':[109,169],
  '电影票':[35,65],   '剧本杀':[68,128], '游戏充值':[30,198],'KTV':[40,90],      '演唱会周边':[88,268],
  '话费充值':[39,59], '生活用品':[30,120],'快递费':[8,25],   '理发':[25,60],      '水电分摊':[50,120]
};
function billAmt(c, note){
  var r = BILL_RANGE[note] || (c === '餐饮' ? [12,30] : [20,120]);
  return Math.round((r[0] + rnd() * (r[1] - r[0])) * 100) / 100;
}

/* ---------- 生成近 6 个月账单（相对当前月，永远有数据） ---------- */
function seedBills(){
  var out = [], mk = curMonth();
  var pool = {
    餐饮:['食堂午餐','食堂早餐','食堂晚餐','校外小吃','奶茶','宿舍聚餐','食堂晚餐','食堂午餐','水果与零食','食堂早餐','外卖','校外小吃'],
    学习:['教材费','打印复印','文具','网课会员','实验报告装订'],
    交通:['地铁通勤','公交','共享单车','打车'],
    娱乐:['电影票','剧本杀','游戏充值','KTV','演唱会周边'],
    其他:['话费充值','生活用品','快递费','理发','水电分摊']
  };
  for (var m = 5; m >= 0; m--){
    var key = shiftMonth(mk, -m), dim = daysInMonth(key);
    var i, c, note, d;
    /* 校园卡充值：每月 1-2 次，是餐饮成为第一大类的关键 */
    var nTop = rint(1, 2);
    for (i = 0; i < nTop; i++){
      d = (m === 0) ? Math.min(rint(1, 16), dim) : rint(1, dim);
      out.push({ id:'b-' + key + '-top' + i, date:key + '-' + pad2(d),
                 amount: billAmt('餐饮','校园卡充值'), category:'餐饮', note:'校园卡充值', auto:false });
    }
    /* 一日三餐与零食 */
    var nFood = (m === 0) ? rint(9, 12) : rint(11, 14);
    for (i = 0; i < nFood; i++){
      c = '餐饮'; note = pick(pool[c]);
      d = (m === 0) ? Math.min(rint(1, 16), dim) : rint(1, dim);
      out.push({ id:'b-' + key + '-f' + i, date:key + '-' + pad2(d),
                 amount: billAmt(c, note), category:c, note:note, auto:false });
    }
    /* 学习 / 交通 / 娱乐 / 其他 */
    var plan = [];
    var nStudy = rint(2, 3);  for (i = 0; i < nStudy; i++) plan.push('学习');
    var nTrip  = rint(2, 4);  for (i = 0; i < nTrip;  i++) plan.push('交通');
    var nFun   = rint(1, 2);  for (i = 0; i < nFun;   i++) plan.push('娱乐');
    var nOther = rint(1, 2);  for (i = 0; i < nOther; i++) plan.push('其他');
    for (i = 0; i < plan.length; i++){
      c = plan[i]; note = pick(pool[c]);
      d = (m === 0) ? Math.min(rint(1, 16), dim) : rint(1, dim);
      out.push({ id:'b-' + key + '-' + c + i, date:key + '-' + pad2(d),
                 amount: billAmt(c, note), category:c, note:note, auto:false });
    }
    /* 高铁往返：每两个月一次，二等座 109-169 元（大连北⇄盘锦真实票价） */
    if (m % 2 === 0){
      d = (m === 0) ? Math.min(rint(1, 16), dim) : rint(1, dim);
      out.push({ id:'b-' + key + '-train', date:key + '-' + pad2(d),
                 amount: billAmt('交通','高铁回家'), category:'交通', note:'高铁回家（大连 ⇄ 盘锦）', auto:false });
    }
  }
  out.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  return out;
}

/* ---------------- 存储：localStorage 单一 key ---------------- */
var KEY = 'xc_app_v3';
var DB = null;

function loadDB(){
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
  if (raw){
    try {
      var o = JSON.parse(raw);
      if (o && o.courses && o.homeworks){
      if (!o.bin) o.bin = []; if (!o.notices) o.notices = []; if (!o.milestones) o.milestones = [];
      if (!o.docs) o.docs = [];
      if (o.billConfig){
        var bc0 = o.billConfig;
        if (bc0.dayWarn == null) bc0.dayWarn = 80;
        if (bc0.dayCap == null) bc0.dayCap = 150;
        if (!bc0.parentCode) bc0.parentCode = '888888';
        if (bc0.locked == null) bc0.locked = false;
        if (bc0.lockedAt == null) bc0.lockedAt = '';
        if (bc0.warnDay == null) bc0.warnDay = '';
      }
      /* 高铁票价自愈：老版本种子里的 268-548 元不符合大连北⇄盘锦真实二等座票价，一次性修到真实档位 */
      if (o.bills && o.bills.length){
        for (var bi = 0; bi < o.bills.length; bi++){
          var bb = o.bills[bi];
          if ((bb.note || '').indexOf('高铁') >= 0 && !(bb.amount >= 109 && bb.amount <= 169)){
            var hsh = 0, hstr = String(bb.id || bb.date || '');
            for (var hj = 0; hj < hstr.length; hj++) hsh = (hsh * 31 + hstr.charCodeAt(hj)) % 9973;
            bb.amount = TRAIN_FARES[hsh % TRAIN_FARES.length];
          }
        }
      }
      return o;
    }
    } catch (e) {}
  }
  var fresh = defaultDB();
  saveDB(fresh);
  return fresh;
}
function saveDB(db){
  var target = db || DB;
  try { localStorage.setItem(KEY, JSON.stringify(target)); return true; }
  catch (e){
    /* 配额不足：把最长的文件正文逐级截断再重试，避免静默丢数据 */
    var caps = [20000, 10000, 5000, 2000], i, k, cut;
    for (i = 0; i < caps.length; i++){
      cut = false;
      if (target.docs){
        for (k = 0; k < target.docs.length; k++){
          var d = target.docs[k];
          if (d.text && d.text.length > caps[i]){ d.text = d.text.slice(0, caps[i]); cut = true; }
        }
      }
      if (!cut) break;
      try { localStorage.setItem(KEY, JSON.stringify(target)); return true; } catch (e2) {}
    }
    try { if (typeof toast === 'function') toast('正文超长，已截断保存'); } catch (e3) {}
    return false;
  }
}
function save(){ saveDB(DB); }
function saveDoc(name, size, text, dom){
  var id = uid('d');
  DB.docs.unshift({ id: id, name: name, size: size,
    text: String(text || '').slice(0, 30000), source: dom || 'study', at: Date.now() });
  save();
  return id;
}
function docFind(id){
  for (var i = 0; i < (DB.docs || []).length; i++){ if (DB.docs[i].id === id) return DB.docs[i]; }
  return null;
}
function resetDB(){
  DB = defaultDB();
  saveDB(DB);
  toast('已重置为演示数据');
  render();
}

/* ---------------- Toast ---------------- */
var _toastTimer = null;
function toast(msg){
  if (typeof focusLocked === 'function' && focusLocked()) return;   /* 专注锁屏期间不弹任何信息 */
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 1900);
}

function resolve(){
  var h = (location.hash || '').replace(/^#/, '');
  if (!h) h = '/schedule';
  var seg = h.split('/').filter(function(s){ return s !== ''; });
  var list = routeTable();
  for (var i = 0; i < list.length; i++){
    var ps = list[i].p.replace(/^#/, '').split('/').filter(function(s){ return s !== ''; });
    if (ps.length !== seg.length) continue;
    var ok = true, param = null;
    for (var j = 0; j < ps.length; j++){
      if (ps[j].charAt(0) === ':'){ param = decodeURIComponent(seg[j]); continue; }
      if (ps[j] !== seg[j]){ ok = false; break; }
    }
    if (ok){ list[i].param = param; return list[i]; }
  }
  return list[0];
}

/* ---------------- 专注强制锁屏 ----------------
   开启后：全屏覆盖，只剩「暂停 / 继续」与「结束专注」两个出口；
   所有提醒（页面内 + 系统通知）暂停推送，toast 全部屏蔽，底部导航与返回键不可用。 */
function lockEnabled(){
  if (!DB.settings) DB.settings = { lockFocus:true };
  return DB.settings.lockFocus !== false;
}
function focusLocked(){
  return !!(STATE.forest && STATE.forest.lock === true);
}
function lockPauseLabel(){
  var f = STATE.forest;
  return (f && f.running) ? '暂停一下' : '继续专注';

function renderLock(){
  var el = document.getElementById('lock');
  if (!el) return;
  if (!focusLocked()){ el.style.display = 'none'; el.innerHTML = ''; return; }
  var f = STATE.forest, el2 = forestElapsed();
  var st = forestStage(f, el2);
  var isUp = f.mode === 'up';
  var total = isUp ? 45 * 60000 : (f.total || 25 * 60000);
  var main = isUp ? fmtHMS(el2) : fmtMS(Math.max(0, total - el2));
  var prog = Math.min(1, total ? el2 / total : 0);
  var sub = isUp ? ('已专注 ' + Math.floor(el2 / 60000) + ' 分钟 · 满 45 分钟开花结果')
                 : (Math.floor(prog * 100) + '% · ' + st.nm);
  var body;
  if (f.confirm){
    body = '<div class="lk-cf">' +
             '<div class="t">确定中途退出吗？</div>' +
             '<div class="m">现在结束，这棵<b>' + esc(st.nm) + '</b>会枯萎，本次专注不会计入成功记录。<br>' +
             '已经专注 ' + Math.max(1, Math.round(el2 / 60000)) + ' 分钟。</div>' +
             '<div class="b"><div style="background:rgba(255,255,255,.12)" data-act="lockCancel">再想想</div>' +
             '<div style="background:#EF4444;color:#fff" data-act="lockEnd">退出并让它枯萎</div></div>' +
           '</div>';
  } else {
    body = '<div class="lk-task">' + esc(f.task) + '</div>' +
           '<div class="lk-sub">' + (isUp ? '正计时 · 不设上限' : '倒计时 ' + curMin0(f) + ' 分钟') +
             ' · 现在跳不到别的页面</div>' +
           '<div class="lk-tree">' + st.svg.replace('width="120" height="120"', 'width="150" height="150"') + '</div>' +
           '<div class="lk-time">' + main + '</div>' +
           '<div class="lk-pct">' + sub + '</div>' +
           '<div class="lk-quit" data-act="lockPause">' + lockPauseLabel() + '</div>' +
           '<div class="lk-quit" style="background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.45);margin-top:10px" data-act="lockEnd">结束专注</div>' +
           '<div class="lk-tip">' + (prog >= 1 ? '时间到了，结束就能看到开花结果'
                                              : '现在结束会让小树枯萎；坚持到底会开花结果') + '</div>';
  }
  el.style.display = 'flex';
  el.innerHTML = '<div class="lk-top">专注中 · 已屏蔽所有提醒与其他页面</div>' + body;
}
ACTIONS.lockPause = function(){
  var f = STATE.forest;
  if (!f) return;
  if (f.running){ f.acc += nowMs() - f.startAt; f.startAt = null; f.running = false; clearTimers(); }
  else { f.startAt = nowMs(); f.running = true; startForestTick(); }
  renderLock();
};

ACTIONS.lockEnd = function(){

var EXT_PERM_LABEL = { autoBill:'账单读取授权', shop:'电商平台订单授权', notify:'系统通知授权',
                       sso:'学校统一身份认证', file:'文件读取', clipboard:'剪贴板', album:'相册' };
function extPermLabel(p){ return p ? (EXT_PERM_LABEL[p] || p) : '无需额外授权'; }
function extPermOk(it){
  if (!it || !it.perm) return true;
  if (it.perm === 'autoBill') return !!(DB.billConfig && DB.billConfig.autoImport);
  if (it.perm === 'notify')   return !!(DB.remind && DB.remind.sysGranted);
  if (it.perm === 'shop' || it.perm === 'sso')
    return !!(DB.gate && DB.gate.choices && DB.gate.choices[it.perm]);
  for (var i = 0; i < DB.permissions.length; i++){
    if (DB.permissions[i].key === it.perm) return DB.permissions[i].state === 'granted';
  }
  return false;
}
function extGrant(it){
  if (!it || !it.perm) return;
  if (it.perm === 'autoBill'){ DB.billConfig.autoImport = true; return; }
  if (it.perm === 'notify'){ DB.remind = DB.remind || {}; DB.remind.sysGranted = true; return; }
  if (it.perm === 'shop' || it.perm === 'sso'){
    DB.gate = DB.gate || {}; DB.gate.choices = DB.gate.choices || {};
    DB.gate.choices[it.perm] = true; return;
  }
  for (var i = 0; i < DB.permissions.length; i++){
    if (DB.permissions[i].key === it.perm) DB.permissions[i].state = 'granted';
  }
}
function extFind(key){
  for (var i = 0; i < EXT_APIS.length; i++){ if (EXT_APIS[i].key === key) return EXT_APIS[i]; }

function qaResolveMod(dom, sel, fb){
  var ms = QA_MODULES[dom] || [], i;
  for (i = 0; i < ms.length; i++){ if (ms[i].key === sel) return sel; }
  return fb || (ms.length ? ms[0].key : '');
}
function qaModName(dom, key){
  var ms = QA_MODULES[dom] || [];
  for (var i = 0; i < ms.length; i++){ if (ms[i].key === key) return ms[i].name; }
  return key;
}
function classifyTarget(raw, domain){
  var t = String(raw || '');
  var kws = QA_KW[domain] || {};
  var order = QA_MODULES[domain] || [];
  var best = { key: '', sc: 0 };
  for (var i = 0; i < order.length; i++){
    var k = order[i].key, sc = 0, list = kws[k] || [];
    for (var j = 0; j < list.length; j++){
      try { if (new RegExp(list[j], 'i').test(t)) sc += 2; } catch (e) {}
    }
    if (domain === 'life'){
      if (k === 'bill' && /(?:¥|￥)\s*\d|\d\s*元/.test(t)) sc += 3;
      if (k === 'express' && /取件码|[A-Z]{2}\d{6,}/.test(t)) sc += 2;
      if (k === 'dorm' && /宿舍|寝室/.test(t)) sc += 1;
      /* 竞赛报名消息里常带报名费，别让它被金额信号拐去账单 */
      if (k === 'activity' && /竞赛|比赛|大赛|[\u676f]/.test(t)) sc += 3;
      if (k === 'treehole' && /牢骚|吐槽|emo|焦虑|压力|失眠|崩溃|郁闷|委屈|难受|好累|失落/.test(t)) sc += 3;
    }
    if (domain === 'study'){
      /* 竞赛名是唯一的强信号：报名/组队的竞赛消息里也常带「截止」，会被作业词压过去 */
      if (k === 'contest' && /竞赛|大赛|挑战杯|数学建模|数模|[\u676f]/.test(t)) sc += 3;
      /* 「竞赛获奖」是已经拿到的结果，不是要去报名的比赛 */
      if (k === 'contest' && /一等奖|二等奖|三等奖|特等奖|金奖|银奖|铜奖|荣获|夺得|斩获|获奖/.test(t)) sc -= 4;
      if (k === 'exam'    && /考试|测验|月考|期中|期末/.test(t)) sc += 2;
      /* 出现「一等奖 / 金奖 / 荣获」这类词，基本就是「拿到了什么」，优先归个人成就 */
      if (k === 'achv'    && /一等奖|二等奖|三等奖|特等奖|金奖|银奖|铜奖|优秀奖|冠军|亚军|季军|荣获|夺得|斩获|获奖/.test(t)) sc += 5;
      if (k === 'achv'    && /奖学金|荣誉|证书|综测/.test(t)) sc += 2;
      if (k === 'plan'    && /规划|路径|目标/.test(t)) sc += 2;
      if (k === 'homework'&& /作业|习题|提交|报告/.test(t)) sc += 2;
    }
    if (sc > best.sc) best = { key: k, sc: sc };
  }
  if (!best.key && order.length) best.key = order[0].key;
  return { key: best.key, sc: best.sc, sure: best.sc >= 4 };
}
function extractAmt(t){
  var m = String(t || '').match(/(?:¥|￥)\s*(\d+(?:\.\d{1,2})?)|(\d+(?:\.\d{1,2})?)\s*元/);
  return m ? (parseFloat(m[1] || m[2]) || 0) : 0;
}
function extractCode(t){
  var m = String(t || '').match(/取件码[:：\s]*([0-9A-Za-z][0-9A-Za-z\-— ]{1,15})/);

}

function qaCommitParsed(){
  var p = STATE.add.parsed;
  if (!p) return;

  (function(){
    var a = document.getElementById('pfTitle'), b = document.getElementById('pfDate'),
        c = document.getElementById('pfTime'), d = document.getElementById('pfLoc'),
        e = document.getElementById('pfAmt'), f = document.getElementById('pfCode'),
        g = document.getElementById('pfNote');
    if (a) p.title = a.value.trim() || p.title;
    if (b && b.value) p.date = b.value;
    if (c && c.value) p.time = c.value;
    if (d && d.value.trim()) p.location = d.value.trim();
    if (e && e.value.trim()) p.amount = e.value.trim();
    if (f && f.value.trim()) p.code = f.value.trim();
    /* 其他信息允许被清空，但只认真正的输入框（避免无该字段时被空值覆盖） */
    if (g && String(g.tagName || '').toUpperCase() === 'INPUT') p.note = g.value.trim();
  })();
  if (!p.title){ toast('事项名称不能为空'); return; }
  var dom = STATE.add.domain || 'study';
  var mk = qaResolveMod(dom, STATE.add.selModule, p.module);
  if (!QA_COMMIT[mk]){ toast('这个分类暂不支持入库，换一个标签试试'); return; }
  if (mk === 'bill' && !(parseFloat(p.amount) > 0)){ toast('没识别到金额，请在金额框里补一个数字'); return; }
  p.docId = STATE.add.docId || '';

  /* 同时写进日程：树洞与账单本身不是「要去做的事」，不往日历里塞 */
  var toSched = STATE.add.toSchedule !== false && mk !== 'treehole' && mk !== 'bill';

    DB.homeworks.push({

      focusCount: 0, focusMin: 0, type: 'assignment', source: '模块同步 · ' + name,
      docId: p.docId || ''

  save();
  STATE.add.parsed = null; STATE.add.wx = ''; STATE.add.docId = '';
  nav(dom === 'study' ? '#/study' : '#/life');

  DT: ['11月8日下午2点', '12月20日上午10:00', '下周三下午4点半'],

           '全国大学生英语竞赛'],
  fee: ['50 元', '80 元', '免费'],
  notes: ['请携带实验报告纸质版', '务必带上学生证与计算器', '记得带学生证',
          '请携带黑色签字笔', '请携带成绩单'],
  r: ['B220', 'A305', 'C518']
};
function qaPick(arr, r){ return arr[Math.floor(r * arr.length) % arr.length]; }
function qaVariant(domain, n){
  var mods = QA_TPL[domain] || {};
  var keys = [], k;
  for (k in mods) keys.push(k);
  var key = keys[n % keys.length];
  var tpls = mods[key];
  var tpl = tpls[Math.floor(labRand(n * 7.7 + 1) * tpls.length) % tpls.length];
  var text = tpl
    .replace(/{P}/g, qaPick(QA_FILL.P, labRand(n * 1.3 + 2)))
    .replace(/{D}/g, qaPick(QA_FILL.D, labRand(n * 2.9 + 3)))
    .replace(/{DT}/g, qaPick(QA_FILL.DT, labRand(n * 4.1 + 4)))
    .replace(/{L}/g, qaPick(QA_FILL.L, labRand(n * 5.7 + 5)))
    .replace(/{n}/g, String(1 + (n % 12)))
    .replace(/{name}/g, qaPick(QA_FILL.names, labRand(n * 6.1 + 6)))
    .replace(/{cname}/g, qaPick(QA_FILL.cnames, labRand(n * 6.7 + 6)))
    .replace(/{code}/g, '3-2-' + (1000 + (n * 137) % 9000))
    .replace(/{amt}/g, qaPick(['15', '30.5', '59', '128'], labRand(n * 8.3 + 7)))
    .replace(/{r}/g, qaPick(QA_FILL.r, labRand(n * 9.9 + 8)))
    .replace(/{fee}/g, qaPick(QA_FILL.fee, labRand(n * 11.3 + 9)))
    .replace(/{note}/g, qaPick(QA_FILL.notes, labRand(n * 12.7 + 10)));
  var exp = { domain: domain, module: key, text: text };
  if (key === 'bill') exp.amount = parseFloat(text.match(/([\d.]+)\s*元/)[1]);
  if (key === 'express') exp.code = text.match(/取件码[:：\s]*([0-9A-Za-z][0-9A-Za-z\-— ]{1,15})/)[1].trim();
  return exp;
}
function qaCheckDom(domain, n){
  var v = qaVariant(domain, n);
  var c = classifyTarget(v.text, domain);
  var bad = [];
  if (c.key !== v.module) bad.push('分类');
  if (v.amount !== undefined){
    var amt = extractAmt(v.text);
    if (Math.abs(amt - v.amount) > 0.001) bad.push('金额');
  }
  if (/携带|带上|带好|自备|准备好/.test(v.text)){
    var nt = extractNote(v.text);
    if (!nt) bad.push('其他信息');
  }
  if (v.code !== undefined){
    var cd = extractCode(v.text);
    if (cd !== v.code) bad.push('取件码');
  }
  return { ok: bad.length === 0, bad: bad, dom: domain, v: v, gotKey: c.key };
}
function qaCheckOne(n){ return qaCheckDom(n % 2 === 1 ? 'study' : 'life', n); }

/* ---------- 日程页：工具 ---------- */
function parseYmd(s){ return new Date(+String(s).slice(0,4), +String(s).slice(5,7) - 1, +String(s).slice(8,10)); }
function impColor(n){ return n >= 3 ? '#4F46E5' : (n === 2 ? '#3B82F6' : '#6B7280'); }
function impName(n){ return n >= 3 ? '重要' : (n === 2 ? '常规' : '次要'); }

function hwDaysLeft(h){
  var d = parseYmd(String(h.deadline).slice(0,10));
  var t = today();
  return Math.round((d - t) / 86400000);
}
function hwTag(h){
  if (h.status === 'done') return '<span class="tag ok">' + ic('check',11,'#047857',2.2) + '已完成</span>';
  var n = hwDaysLeft(h);
  if (n < 0) return '<span class="tag danger">逾期 ' + (-n) + ' 天</span>';
  if (n === 0) return '<span class="tag warn">今天截止</span>';
  if (n <= 2) return '<span class="tag warn">' + n + ' 天后截止</span>';
  return '<span class="tag">' + n + ' 天后截止</span>';
}

function hwFind(id){
  for (var i = 0; i < DB.homeworks.length; i++){ if (DB.homeworks[i].id === id) return DB.homeworks[i]; }
  return null;
}

/* ---------- 灵动岛：下一件事 ---------- */
function nowHm(){
  var d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function nextUpItem(){
  var pend = pendingHomeworks();
  var d = new Date(), dow = dayOfWeek(d), hm = nowHm();
  var cs = DB.courses.filter(function(c){ return c.day === dow; })
                     .sort(function(a,b){ return a.start < b.start ? -1 : 1; });
  var nextCourse = null;
  for (var i = 0; i < cs.length; i++){ if (cs[i].start > hm){ nextCourse = cs[i]; break; } }

  if (pend.length){
    var p0 = pend[0], n = hwDaysLeft(p0);
    if (n < 0){
      return { kind:'已逾期 ' + (-n) + ' 天', title:p0.title, time:'截止 ' + String(p0.deadline).slice(0,10) + ' ' + String(p0.deadline).slice(11),
               go:'#/study/homework/' + p0.id };
    }
    if (n === 0 && !nextCourse){
      return { kind:'今天截止', title:p0.title, time:'截止 ' + String(p0.deadline).slice(11), go:'#/study/homework/' + p0.id };
    }
    if (n === 0 && nextCourse){
      return { kind:'今天截止', title:p0.title, time:'截止 ' + String(p0.deadline).slice(11) + ' · 之后还有 ' + nextCourse.title,
               go:'#/study/homework/' + p0.id };
    }
  }
  if (nextCourse){
    return { kind:'下一节课 ' + nextCourse.start, title:nextCourse.title,
             time:nextCourse.start + ' - ' + nextCourse.end + ' · ' + nextCourse.location,
             go:'#/schedule' };
  }
  if (pend.length){
    var p1 = pend[0];
    return { kind:hwDaysLeft(p1) + ' 天后截止', title:p1.title,
             time:String(p1.deadline).slice(0,10) + ' ' + String(p1.deadline).slice(11),
             go:'#/study/homework/' + p1.id };
  }
  return null;
}

function labRand(i){ var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
function labPick(arr, r){ return arr[Math.floor(r * arr.length) % arr.length]; }
function normLoc(v){ return String(v || '').replace(/\s+/g, '').replace(/[-—]/g, '').toLowerCase(); }

function labDateFmt(b, r){
  if (r < 0.42) return b.mo + '月' + b.d + '日（周' + LAB_WD[(laborDow(b) - 1 + 7) % 7] + '）';
  if (r < 0.72) return b.mo + '月' + b.d + '日';
  if (r < 0.88) return b.mo + '月' + b.d + '号';
  return b.mo + ' 月 ' + b.d + ' 日';
}
function laborDow(b){
  var y = new Date().getFullYear();
  return new Date(y, b.mo - 1, b.d).getDay() === 0 ? 7 : new Date(y, b.mo - 1, b.d).getDay();
}
function labTimeFmt(b, r){
  var hh = b.hh, mm = b.mm, ap = b.ap;
  if (r < 0.34) return ap + hh + ':' + mm;
  if (r < 0.58) return hh + ':' + mm;
  if (r < 0.74) return ap + hh + '点' + (mm !== '00' ? mm + '分' : '');
  if (r < 0.88){
    var eh = (hh + 1) % 24;
    return hh + ':' + mm + '-' + eh + ':' + mm;
  }
  return ap + hh + '点' + (mm !== '00' ? ' ' + mm + ' 分' : '');
}
function labVenueFmt(v, r){
  if (r < 0.24) return '在' + v;
  if (r < 0.48) return '地点：' + v;
  if (r < 0.62) return '地点:' + v;
  if (r < 0.78) return v;
  if (r < 0.9)  return '地点：' + v + '（西校区）';
  return '于' + v;
}

  else if (ord === 3) segs = [b.t, locS, dateS + timeS, review, b.note];

/* n：第 n 个样本。返回 { text, exp:{title,loc,hh,mm,date} } —— 同时充当标准答案 */
function labVariant(n){
  if (n % 3 === 1) return labExamVariant(n);
  if (n % 3 === 2) return labNoticeVariant(n);
  var R = [], i;
  for (i = 0; i < 10; i++) R.push(labRand(n * 13.37 + i * 7.77 + 1.3));
  var b = labPick(LAB_BASE, R[0]);
  var venue = R[1] < 0.22 ? labPick(LAB_MORE, R[2]) : b.v;
  var useBook = R[3] > 0.22;                       /* 是否用《》书名号写法 */
  var spk = labPick(LAB_SPK, R[4]);
  var credit = R[5] < 0.6 ? '可记 0.2 学分' : '到场同学可加综测分';
  var scan  = R[6] < 0.5 ? '扫码进群报名👇' : '报名方式：群内接龙';
  var atall = R[7] < 0.5 ? '@所有人 ' : '';
  var hello = labPick(['各位同学：', '同学们好～', '各位同学注意：', '通知：', '小伙伴们：'], R[8]);
  var dateS = labDateFmt(b, R[9]);
  var timeS = labTimeFmt(b, labRand(n * 5.11 + 21.7));
  var venS  = labVenueFmt(venue, labRand(n * 3.71 + 9.9));
  var titleCore = useBook ? '《' + b.t + '》' : b.t;
  var titleWait = useBook ? b.t : '';
  var style = Math.floor(labRand(n * 17.3 + 3.9) * 6) % 6;
  /* 内联写法（0/2/4）一定带《》书名号 —— 这也是真实通知里最标准的写法；
     不带《》的场景只留给「多行结构化」的三类模板（1/3/5），考验模型换个结构还能不能认出来。 */
  if (style === 0 || style === 2 || style === 4){ useBook = true; titleCore = '《' + b.t + '》'; }
  var text = '';

  if (style === 0){
    text = atall + hello + dateS + timeS + venS + '举办' + titleCore + b.k + '，' + credit + '。' + scan;
  } else if (style === 1){
    text = '【' + b.k + '预告】\n' + (useBook ? '主题：《' + b.t + '》' : '主题：' + b.t) +
           '\n时间：' + dateS + ' ' + timeS + '\n地点：' + venue +
           '\n主讲：' + spk + '\n' + credit + '\n' + scan;
  } else if (style === 2){
    text = atall + hello + '本周有个很不错的' + b.k + '要推荐给大家：' + titleCore + '\n' +
           dateS + ' ' + timeS + '\n' + venue + '\n欢迎来听！' + credit;
  } else if (style === 3){
    text = dateS + ' ' + timeS + '\n' + venue + '\n' + titleCore + '\n' +
           spk + ' · ' + credit + '\n请提前 10 分钟到场签到。';
  } else if (style === 4){
    text = hello + '\n为拓展同学的视野，学院定于' + dateS + ' ' + timeS + ' ' + venS + '举行' +
           titleCore + b.k + '。\n' + spk + '主讲，' + credit + '，望周知。\n' + scan;
  } else {
    text = '📢 ' + b.t + ' ' + b.k + '\n⏰ ' + dateS + ' ' + timeS + '\n📍 ' + venue +
           '\n' + spk + ' · ' + credit + '\n' + scan;
  }
  if (R[9] > 0.8) text += '\n收到请回复🙂';

  return {
    text: text,
    exp: {
      title: b.t,
      loc: venue,
      hh: b.hh,
      mm: parseInt(b.mm, 10),
      date: (function(){
        var y = new Date().getFullYear();
        return y + '-' + pad2(b.mo) + '-' + pad2(b.d);
      })(),
      time: pad2(b.hh) + ':' + b.mm
    }
  };
}

function labTitle(v){ return normLoc(v).replace(/(报告会|分享会|宣讲会|沙龙|讲座|报告|课程|活动)$/, ''); }
function labCheckOne(n){
  var v = labVariant(n), p = parseWxMsg(v.text), e = v.exp;
  var bad = [];
  if (!p) return { ok: false, bad: ['无法解析'], v: v, p: null };
  if (labTitle(p.title.replace(/[（(].*$/, '')) !== labTitle(e.title)) bad.push('事项');
  if (p.date !== e.date) bad.push('日期');
  if (p.time !== pad2(e.hh) + ':' + pad2(e.mm)) bad.push('时间');
  if (normLoc(p.location) !== normLoc(e.loc)) bad.push('地点');
  if (e.note && String(p.note || '').trim() !== e.note) bad.push('其他信息');
  return { ok: !bad.length, bad: bad, v: v, p: p };
}

       '<div style="height:8px"></div>' +
       '<button class="btn sub sm" style="width:100%" data-act="labStop">停止</button>' +
       '<div id="labOut" style="margin-top:10px"></div>' +
       '</div>';

  if (L.ran){
    h += '<div class="sec">各项准确率</div><div class="card">';
    if (labDom === 'schedule'){
      h += labBar('地点识别', L.n ? (L.n - L.fLoc) / L.n : 0, '#8B5CF6') +
           labBar('事项名称', L.n ? (L.n - L.fTitle) / L.n : 0, '#4F46E5') +
           labBar('日期',     L.n ? (L.n - L.fDate) / L.n : 0, '#0EA5E9') +
           labBar('时间',     L.n ? (L.n - L.fTime) / L.n : 0, '#10B981') +
           labBar('其他信息', L.n ? (L.n - (L.fNote || 0)) / L.n : 0, '#F59E0B') +
           '<div style="font-size:11px;color:#6B7280;line-height:1.75;margin-top:10px">' +
           '判定口径：五项全部等于标准答案才算命中。共 ' + L.n + ' 条样本，' +
           '其中地点错 ' + L.fLoc + ' 条、事项错 ' + L.fTitle + ' 条、日期错 ' + L.fDate + ' 条、时间错 ' + L.fTime +
           ' 条、其他信息错 ' + (L.fNote || 0) + ' 条。</div>';
    } else {
      h += labBar('模块分类', L.n ? (L.n - L.fCls) / L.n : 0, '#4F46E5');
      if (labDom === 'life'){
        h += labBar('金额提取', L.n ? (L.n - L.fAmt) / L.n : 0, '#10B981');
        h += labBar('取件码提取', L.n ? (L.n - L.fCode) / L.n : 0, '#0EA5E9');
      }
      h += '<div style="font-size:11px;color:#6B7280;line-height:1.75;margin-top:10px">' +
           '判定口径：模块分类' + (labDom === 'life' ? '、金额、取件码' : '') + '全部等于标准答案才算命中。共 ' + L.n + ' 条样本，分类错 ' + L.fCls + ' 条。</div>';
    }
    h += '</div>';

    if (L.curve.length){
      h += '<div class="sec">准确率曲线</div><div class="card">' + labCurve(L.curve) + '</div>';
    }
    if (L.bad.length){
      h += '<div class="sec">最近 3 条未通过样本</div>';
      for (var i = L.bad.length - 1; i >= Math.max(0, L.bad.length - 3); i--){
        var it = L.bad[i];
        h += '<div class="card"><div style="font-size:11px;color:#EF4444;font-weight:700">' +
             '第 ' + it.n + ' 条 · 错在：' + esc(it.bad.join(' / ')) + '</div>' +
             '<div style="font-size:11px;color:#4B5563;line-height:1.7;margin-top:6px;white-space:pre-wrap">' + esc(it.text.slice(0, 120)) + '</div>' +
             '<div style="font-size:11px;color:#6B7280;margin-top:6px;line-height:1.7">' +
             (it.dom && it.dom !== 'schedule' ?
               '期望模块：' + esc(it.exp.module) + '<br>实得：' + esc(it.gotKey || '（无）') :
               '期望：' + esc(it.exp.title) + ' · ' + esc(it.exp.loc) + ' · ' + esc(it.exp.date) + ' ' + esc(it.exp.time) + '<br>' +
               '实得：' + esc(it.got ? (it.got.title + ' · ' + (it.got.location || '（空）') + ' · ' + it.got.date + ' ' + it.got.time) : '（无法解析）')) +
             '</div></div>';
      }
      h += '<div style="font-size:11px;color:#6B7280;padding:8px 2px;line-height:1.7">' +
           '未通过的样本会留在表里，改一版规则再跑一轮 —— 这就是这台原型的「AI 训练」闭环。</div>';
    }
  }

  h += '<div class="sec">语料是怎么被改写的</div><div class="card" style="font-size:12px;line-height:1.9;color:#4B5563">' +
       '10 条讲座基准 × <b>6 种语气模板</b>（群 at / 公众号多行 / 口语推荐 / 竖排海报 / 学院公文 / emoji 卡片）<br>' +
       '＋ <b>10 条考试通知基准</b>（单元测验 / 听力小测 / 期中考试…）× <b>6 种子句顺序</b>' +
       '（时间·地点·内容·提示 随便换位置）<br>' +
       '＋ <b>12 条培训 / 辅导通知基准</b>（实操培训 / 集中辅导 / 编程实训 / 答疑专场 / 中期汇报 / 汇报彩排…）' +
       '× <b>6 种子句顺序</b><br>' +
       '× <b>4 种日期写法</b>（11月15日 / 带周几 / 号 / 带空格）<br>' +
       '× <b>5 种时间写法</b>（上午10:00 / 10:00 / 上午10点30分 / 10:00-11:30 / 上午10点）<br>' +
       '× <b>6 种地点写法</b>（在… / 地点：… / 半角冒号 / 裸地点 / 带校区括号 / 于…）<br>' +
       '× <b>随机噪声</b>（@所有人 / 主讲人 / 学分 / 扫码进群 / emoji / 收到请回复）<br>' +
       '另外有 22% 的样本会把场地换成扩展池（图书馆报告厅、主楼 A101、A01-305…），逼模型别死记硬背。<br>' +
       '<b>学习 / 生活分类</b>：每个模块各 3 条模板 × 噪声前缀 × 日期写法 × 子句顺序随机改写，标准答案 = 模板所属模块，判分口径为分类' +
       '（生活域另加金额、取件码提取）。</div>';
  return h;
}
function labBar(name, rate, color){
  var p = Math.round(rate * 1000) / 10;
  return '<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">' +
         '<span>' + name + '</span><b style="color:' + color + '">' + p + '%</b></div>' +
         '<div style="height:6px;border-radius:3px;background:#F0F1F5;overflow:hidden">' +
         '<div style="height:100%;width:' + p + '%;background:' + color + ';border-radius:3px;transition:width .4s"></div></div></div>';
}
function labCurve(curve){
  var w = 300, hh = 74, pts = '', step = curve.length > 1 ? w / (curve.length - 1) : w;
  var poly = [];
  for (var i = 0; i < curve.length; i++){
    var x = i * step, y = hh - (curve[i] / 100) * hh;
    poly.push(x.toFixed(1) + ',' + y.toFixed(1));
    pts += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2" fill="#4F46E5"/>';
  }
  return '<svg viewBox="0 0 ' + w + ' ' + hh + '" width="100%" height="' + hh + '" preserveAspectRatio="none">' +
    '<polyline points="' + poly.join(' ') + '" fill="none" stroke="#4F46E5" stroke-width="1.6" stroke-linejoin="round"/>' +
    pts + '</svg>' +
    '<div style="display:flex;justify-content:space-between;font-size:10px;color:#9CA3AF;margin-top:3px"><span>第 1 轮</span><span>第 ' + curve.length + ' 轮</span></div>';
}

ACTIONS.labDom = function(a){
  clearTimeout(STATE.labTimer);
  var L = STATE.lab || { ran:false, rounds:0, n:0, hit:0, fTitle:0, fDate:0, fTime:0, fLoc:0, fNote:0, curve:[], bad:[], dom:'schedule', fCls:0, fAmt:0, fCode:0 };
  L.dom = a; L.ran = false; L.n = 0; L.hit = 0; L.rounds = 0;
  L.fCls = 0; L.fAmt = 0; L.fCode = 0; L.fTitle = 0; L.fDate = 0; L.fTime = 0; L.fLoc = 0; L.fNote = 0;
  L.curve = []; L.bad = [];
  STATE.lab = L;
  render();
};
ACTIONS.labRun = function(a){
  var total = parseInt(a, 10) || 10;
  clearTimeout(STATE.labTimer);
  var L = STATE.lab || { ran:false, rounds:0, n:0, hit:0, fTitle:0, fDate:0, fTime:0, fLoc:0, fNote:0, curve:[], bad:[], dom:'schedule', fCls:0, fAmt:0, fCode:0 };
  L.ran = true;
  STATE.lab = L;
  var done = 0, per = 6;                 /* 每轮 6 条样本 */
  var o = document.getElementById('labOut');
  function step(){
    for (var i = 0; i < per && done < total; i++, done++){
      var n = L.n + 1;
      var r = (L.dom || 'schedule') === 'schedule' ? labCheckOne(n) : qaCheckDom(L.dom, n);
      L.n = n; L.rounds += 1;
      if (r.ok) L.hit++;
      else if (L.bad.length < 60){
        L.bad.push({ n:n, bad:r.bad, text:r.v.text, exp:r.v.exp, got:r.p, dom:(L.dom || 'schedule'), gotKey:r.gotKey || '' });
      }
      if (r.bad.indexOf('地点') >= 0) L.fLoc++;
      if (r.bad.indexOf('事项') >= 0) L.fTitle++;
      if (r.bad.indexOf('日期') >= 0) L.fDate++;
      if (r.bad.indexOf('时间') >= 0) L.fTime++;
      if (r.bad.indexOf('其他信息') >= 0) L.fNote++;
      if (r.bad.indexOf('分类') >= 0) L.fCls++;
      if (r.bad.indexOf('金额') >= 0) L.fAmt++;
      if (r.bad.indexOf('取件码') >= 0) L.fCode++;
      var acc = Math.round(L.hit / L.n * 1000) / 10;
      if (L.rounds % 5 === 0 || done === total) L.curve.push(acc);
    }
    if (o){
      o.innerHTML = '<div style="font-size:11px;color:#4F46E5;font-weight:700">训练中 ' + done + ' / ' + total +
                    ' 轮 · 累计 ' + L.n + ' 条 · 准确率 ' + (Math.round(L.hit / L.n * 1000) / 10) + '%</div>';
    }
    if (done < total){ STATE.labTimer = setTimeout(step, 90); }
    else { render(); toast('已训练 ' + total + ' 轮，当前准确率 ' + (Math.round(L.hit / L.n * 1000) / 10) + '%'); }
  }
  step();
};

function doParse(){
  var ta = document.getElementById('impText');
  if (ta) STATE.imp.text = ta.value;
  var im = STATE.imp;
  im.items = []; im.errors = []; im.checked = {};

  var raw = (im.text || '').trim();
  if (!raw){ im.errors.push('请先粘贴 JSON 或选择 .json 文件'); render(); return; }

  var obj;
  try { obj = JSON.parse(raw); }
  catch (e){ im.errors.push('JSON 解析失败：' + e.message); render(); return; }

  var arr = obj && obj.items ? obj.items : (obj && obj.length ? obj : null);
  if (!arr || !arr.length){ im.errors.push('未找到 items 数组，请检查协议格式'); render(); return; }

  var existId = {};
  for (var i = 0; i < DB.courses.length; i++) existId[DB.courses[i].id] = 1;
  for (var j = 0; j < DB.homeworks.length; j++) existId[DB.homeworks[j].id] = 1;

  var ok = [];
  for (var n = 0; n < arr.length; n++){
    var it = arr[n] || {}, idx = n + 1;
    if (!it.id){ im.errors.push('第 ' + idx + ' 条：缺少字段 id'); continue; }
    if (!it.title){ im.errors.push('第 ' + idx + ' 条：缺少字段 title'); continue; }
    if (!it.start){ im.errors.push('第 ' + idx + ' 条：缺少字段 start'); continue; }
    if (TYPES.indexOf(it.type) < 0){ im.errors.push('第 ' + idx + ' 条：类型不支持（' + (it.type || '空') + '）'); continue; }
    var s = isoToParts(it.start), e = it.end ? isoToParts(it.end) : null;
    if (!s){ im.errors.push('第 ' + idx + ' 条：start 时间格式不合法'); continue; }
    if (e && s.date > e.date){ im.errors.push('第 ' + idx + ' 条：时间区间不合法'); continue; }
    if (existId[it.id]){ im.errors.push('第 ' + idx + ' 条：id 重复（' + it.id + '）'); continue; }
    existId[it.id] = 1;
    ok.push({
      id: it.id, type: it.type, title: it.title, start: it.start, end: it.end || it.start,
      location: it.location || '', importance: it.importance || 2, note: it.note || '',
      source: (obj && obj.source) || 'SCHOOL_AGENT'
    });
  }
  im.items = ok;
  render();
  if (!im.errors.length && ok.length) toast('校验通过 ' + ok.length + ' 条，请确认导入');
}

ACTIONS.confirmImport = function(){

    var it = im.items[i];
    if (im.checked[it.id] === false) continue;
    var s = isoToParts(it.start), e = isoToParts(it.end);
    if (it.type === 'course' || it.type === 'activity'){
      DB.courses.push({
        id: it.id, title: it.title, teacher: '待同步', location: it.location || '待通知',
        day: dayOfWeek(s.date), start: s.hm, end: (e || s).hm,
        importance: it.importance, type: it.type, source: it.source
      });
    } else {
      DB.homeworks.push({
        id: it.id, title: it.title, subject: it.type === 'exam' ? '考试' : '导入任务',
        deadline: (e || s).ymd + 'T' + (e || s).hm,

      });

  }
  if (!n){ toast('没有勾选任何条目'); return; }
  save();
  im.items = []; im.errors = []; im.checked = {}; im.text = ''; im.fileName = '';
  nav('#/schedule');
  toast('成功导入 ' + n + ' 条');
};

function locTrim(v){

    .replace(/^[^0-9A-Za-z\u4e00-\u9fa5]+/, '')
    .replace(/(?:(?:举办|举行|开展|召开|组织|集合|签到|参加|出席|上课|开会|讲座|活动|分享会|宣讲会|宣讲|比赛|竞赛|考试|答辩|报名|截止|名额|学分|学时|综测|扫码|二维码|进群|同学|同学们|老师|教授|主讲|到场|欢迎)+$)/, '')

function locLooks(v){
  if (!v || v.length < 2 || v.length > 26) return false;
  if (/(?:研讨间|研讨室|会议室|报告厅|实验室|教室|机房)\s*\d{1,3}\s*号?$/.test(v)) return true;

function extractLoc(raw, title){
  var best = { v: '', sc: -1e9 };
  function consider(v, base, nearTime, tail){
    v = locTrim(v);
    if (!locLooks(v)) return;
    if (/^(周[一二三四五六日天]|今天|明天|后天|上午|下午|晚上|中午|早上)$/.test(v)) return;
    if (/\d{1,2}\s*[:：]\s*\d{2}/.test(v)) return;
    var sc = base;
    if (/(报告厅|多功能厅|会议室|阶梯教室|活动室|研讨室|演播厅|教室|礼堂|讲堂|大厅)$/.test(v)) sc += 30;
    else if (/(图书馆|体育馆|中心|食堂|操场|实验室)$/.test(v)) sc += 22;
    if (/[A-Za-z]/.test(v) && /\d/.test(v)) sc += 20;
    if (nearTime) sc += 14;
    if (tail) sc += 8;
    if (title && v === title) sc -= 300;
    else if (title && title.indexOf(v) >= 0) sc -= 40;
    if (sc > best.sc || (sc === best.sc && v.length > best.v.length)) best = { v: v, sc: sc };
  }
  var m, re, hit;
  var flat = String(raw || '').replace(/\s+/g, ' ');
  var timeRe = /(\d{1,2}\s*[:：]\s*\d{2})|(\d{1,2}\s*[点時时])|(上午|下午|晚上|中午|早上|傍晚)/;

  /* A：显式标签「地点 / 位置 / 会场 / 地址」 */
  re = /(?:地点|位置|会场|举办地点|活动地点|讲座地点|地址)\s*[:：]\s*([^\n，,。;；、！!？?：:《》]{2,26})/g;
  while ((m = re.exec(flat))){ consider(m[1], 60, false, false); }

  /* B：「在 / 于」引导 */
  re = /(?:^|[，,。\n；;、]|\s)(?:在|于)\s*([^\n，,。;；、！!？?：:《》]{2,26})/g;
  while ((m = re.exec(flat))){
    hit = timeRe.test(m[1]);
    consider(m[1], 45, false, false);
  }

  /* C1：带楼宇/场馆前缀的房号 —— 主楼 A101、机房 D2、实验楼 E3 报告厅、图书馆 B208 */
  var ROOM = '[A-Za-z]{1,2}\\s*[-—]?\\s*\\d{1,4}(?:[-—]\\d{1,4})?';
  var HALL = '(?:\\s*(?:多功能报告厅|学术报告厅|多功能厅|报告厅|会议室|阶梯教室|多媒体教室|活动室|研讨室|培训室|自习室|实验室|教室|考场|机房|演播厅|礼堂|讲堂|大厅|会堂|馆|楼|厅|室|场))?';
  re = new RegExp('((?:主楼|行政楼|教学楼|实验楼|科技楼|文科楼|理科楼|图书馆|体育馆|机房|礼堂|大学生活动中心|就业指导中心)\\s*' + ROOM + HALL + ')', 'g');
  while ((m = re.exec(flat))){ consider(m[1], 54, false, false); }

  /* C2：纯房号 —— B05 多功能厅、A01-305、B03-108 */
  re = new RegExp('(' + ROOM + HALL + ')', 'g');
  while ((m = re.exec(flat))){ consider(m[1], 40, false, false); }

  /* G：研讨间 / 会议室 / 实验室 + 编号（图书馆研讨间 3 号、D 栋会议室 302、学院研讨室 201） */
  re = /((?:[A-Za-z]\s*栋\s*|图书馆\s*|教学楼\s*|实验楼\s*|学院\s*|学生活动中心\s*|理化|化学|物理|生物|计算机)?\s*(?:研讨间|研讨室|会议室|报告厅|实验室)\s*\d{1,3}\s*号?)/g;
  while ((m = re.exec(flat))){ consider(m[1], 68, false, false); }

  re = new RegExp('((?:校内|校内|西校区|东校区|新校区|老校区|学校)?\\s*(?:' + LOC_PLACE + ')(?:\\s*[A-Za-z]?\\d{1,4})?)', 'g');
  while ((m = re.exec(flat))){ consider(m[1], 40, false, false); }

  /* E：楼/馆 + 房间号 */
  re = /((?:机房|教学楼|实验楼|行政楼|主楼|图书馆|体育馆)\s*[A-Za-z]{0,2}\s*[-—]?\s*\d{1,4}(?:[-—]\d{1,4})?)/g;
  while ((m = re.exec(flat))){ consider(m[1], 38, false, false); }

  /* F：地点独占一行、或紧挨着时间词出现（补那些完全没有引导词的写法） */
  var lines = String(raw || '').split(/\n/);
  for (var i = 0; i < lines.length; i++){
    var ln = (lines[i] || '').trim();
    if (!ln || ln.length > 30) continue;
    if (/^\s*[@【（(]/.test(ln)) continue;
    var hasT = timeRe.test(ln);
    var nearT = hasT || (i > 0 && timeRe.test(lines[i - 1] || '')) || (i < lines.length - 1 && timeRe.test(lines[i + 1] || ''));
    var whole = locTrim(ln.replace(/^[-•·*\d]+[.、)]?\s*/, ''));
    if (locLooks(whole)) consider(whole, hasT ? 26 : 18, nearT, i >= lines.length * 0.4);
  }
  return best.sc > 0 ? best.v : '';
}

/* 事项全名：形如「线性代数期中考试 / 大学英语听力小测 / 全国大学生数学建模竞赛」 */
var EV_SUFFIX = '(?:报告会|分享会|宣讲会|培训会|汇报会|研讨会|座谈会|交流会|说明会|动员会|研读会|工作坊|' +
                '考试|测验|测试|小测|测评|机考|竞赛|大赛|比赛|校赛|校内赛|个人赛|团体赛|选拔赛|初赛|复赛|决赛|海选|讲座|答辩|培训|实训|辅导|彩排|专场|梳理|汇报|' +
                '沙龙|论坛|讲坛|观摩|演练|活动|双选会|招聘会|见面会)';
function findEventName(raw, loc){
  var t = String(raw || '');
  if (loc) t = t.split(loc).join(' ');
  var re = new RegExp('([\\u4e00-\\u9fa5A-Za-z0-9（）()·\\-+]{2,30}?' + EV_SUFFIX + ')', 'g');
  var m, best = '', bestSc = -1;
  while ((m = re.exec(t))){
    var v = m[1]
      .replace(/^(?:举办|举行|开展|召开|组织|参加|报名|关于|由于|为了|本次|此次|这场)/, '')
      .replace(/^[在于将定对把从]/, '')
      .trim();
    var cjk = (v.match(/[\u4e00-\u9fa5A-Za-z0-9]/g) || []).length;
    if (cjk < 4) continue;
    /* 英文前缀：Python 编程实训 —— 命中的是「编程实训」，要把前面的英文词接回来 */
    var pre = t.slice(0, m.index);
    var lm = pre.match(/([A-Za-z][A-Za-z0-9+#.]*)\s+$/);
    if (lm){ v = lm[1] + ' ' + v; cjk += lm[1].length; }
    var sc = cjk;
    /* 命中位置之后在同一子句里还有内容：若是「定于/将在/请」等连接词 → 标题已完整，小扣；
       若是名词短语 → 说明标题还没说完（「生物学科竞赛」+「备战思路」），直接拼起来 */
    var rest = t.slice(m.index + m[1].length);
    var ce = rest.search(/[，,。；;、\n]/);
    var tailClause = (ce >= 0 ? rest.slice(0, ce) : rest).trim();
    if (tailClause){
      /* 后面紧接另一个后缀短语（「全国…竞赛」+「校内选拔赛」、或「研究生入学考试」+「备考规划讲座」）→ 拼起来 */
      var ext = tailClause.match(new RegExp('^[\\u4e00-\\u9fa5A-Za-z0-9（）()·\\-+]{0,12}?' + EV_SUFFIX));
      if (ext){
        v += ext[0];
        cjk += (ext[0].match(/[\u4e00-\u9fa5A-Za-z0-9]/g) || []).length;
        sc = cjk;
      } else if (/^(?:将|将于|将在|定于|将于|在|于|的|开展|举行|举办|开始|进行|安排|时间|地点|请|要求|须知|报名|截止|名额|学分|学时|到场|签到|，)/.test(tailClause)){
        sc -= 6;
      } else {
        sc -= 12;
      }
    }
    /* 叮嘱/物品清单扣分只认「开头」，避免「申请」里的「请」被误伤 */
    if (/^(请|务必|记得|提前|携带|带好|自备|准备|复习|注意)/.test(v)) sc -= 12;
    /* 以「按时 / 各组 / 大家 / 建议 / 避免 / 老师」开头的是叮嘱，不是事项名 */
    if (/^(按时|各组|大家|建议|避免|老师|同学|请|记得|务必|提前|现场)/.test(v)) sc -= 20;
    if (sc > bestSc){ bestSc = sc; best = v; }
  }
  /* 无后缀兜底：没命中任何事件后缀时，找「含线索词、又不像是叮嘱/时间地点」的最长子句 */
  if (!best){
    var clueRe = /(培训|讲座|考试|竞赛|活动|会议|辅导|答疑|分享|经验|技巧|介绍|说明|方案|研讨|交流|彩排|汇报|梳理|研读|实训|沙龙|论坛|指南|攻略|心得|观摩|演练|答辩|专场|作业|习题|报告|论文|任务|实验|机考|校赛|选拔赛|初赛|复赛|决赛|海选)/;
    var segs = t.split(/[，,。；;、\n]/);
    for (var si = 0; si < segs.length; si++){
      var sg = String(segs[si]).replace(/^[，,、。：:\s「」“”·]+/, '').replace(/[，,、。：:\s]+$/, '').trim();
      sg = sg.replace(/^(?:通知|提醒|注意|各位同学|同学们|各位|大家好|所有人|全体同学)\s*[：:，,、]?\s*/, '');
      sg = sg.replace(/(定于|将于|将在|拟定于|安排在)[\s\S]*$/, '');
      sg = cleanTitleLine(sg);
      var cjk2 = (sg.match(/[\u4e00-\u9fa5A-Za-z0-9]/g) || []).length;
      if (cjk2 < 4 || cjk2 > 30) continue;
      if (/^(请|记得|务必|提前|按时|各组|大家|建议|避免|老师|同学|注意|需|须|要|带|携带|自备|准备|关于)/.test(sg)) continue;
      if (/^\d/.test(sg) || /^(月|日|上午|下午|晚上|中午|早上|周|本|下)/.test(sg)) continue;
      if (clueRe.test(sg) && cjk2 > bestSc){ bestSc = cjk2; best = sg; }
    }
  }
  return best;
}
/* 其他信息：携带物品 / 注意事项 */
function extractNote(raw){
  var t = String(raw || '');
  var m = t.match(/((?:务必|请|记得|注意|须|需|要|可|建议)?[^。；;，,\n]{0,8}?(?:携带|带上|带好|自带|自备|备好|准备好|准备|佩戴|穿|带)[^。；;，,\n]{0,26})/);
  if (!m) return '';
  var v = m[1];
  for (var k = 0; k < 4; k++){
    var before = v;
    v = v.replace(/^[，,、。：:\s]+/, '')
         .replace(/^@[^\s，,。：:]{0,12}\s*/, '')
         .replace(/^(?:通知|提醒|注意|各位同学|同学们|各位|大家好|所有人|全体同学)\s*[：:，,、]?\s*/, '');
    if (v === before) break;
  }
  v = v.trim();
  if (v.length < 3) return '';
  return v.slice(0, 40);
}

function parseWxMsg(text){
  var raw = String(text || '').replace(/\r/g, '');
  var s = raw.replace(/\s+/g, ' ').trim();
  if (!s) return null;
  var y = today().getFullYear(), date = null;

  var dm = s.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/);
  if (dm){ date = y + '-' + pad2(+dm[1]) + '-' + pad2(+dm[2]); }
  if (!date && /后天/.test(s)) date = ymd(addDays(today(), 2));
  if (!date && /明天|明日/.test(s)) date = ymd(addDays(today(), 1));
  if (!date && /今天|今日/.test(s)) date = ymd(today());
  if (!date){
    var wd = s.match(/([下这]?)周([一二三四五六日天])/);
    if (wd){
      var target = WD_MAP[wd[2]] || 1, cur = dayOfWeek(today());
      var delta = target - cur;
      if (wd[1] === '下') delta += 7;
      if (delta <= 0) delta += 7;
      date = ymd(addDays(today(), delta));
    }
  }
  if (!date) date = ymd(addDays(today(), 1));

  /* 时间：支持「14:00」「下午2点」「下周三下午」三种写法 */
  var ampm = s.match(/(上午|早上|凌晨|中午|下午|晚上|傍晚)/);
  var clock = s.match(/(\d{1,2})\s*[:：]\s*(\d{2})/);
  var oclock = s.match(/(\d{1,2})\s*[点時时]\s*(?:(\d{1,2})\s*分?)?/);
  var time = '23:59', hh = 0, mm = 0;
  if (clock){ hh = +clock[1]; mm = +clock[2]; }
  else if (oclock){ hh = +oclock[1]; mm = +(oclock[2] || 0); }
  if (clock || oclock){
    if (ampm && /下午|晚上|傍晚/.test(ampm[1]) && hh < 12) hh += 12;
    if (ampm && /凌晨|早上/.test(ampm[1]) && hh === 12) hh = 0;
    if (hh > 23) hh = 23;
    time = pad2(hh) + ':' + pad2(mm);
  } else if (ampm){
    time = ({ '上午':'10:00', '早上':'09:00', '凌晨':'07:00', '中午':'12:00', '下午':'15:00', '晚上':'19:30', '傍晚':'18:00' })[ampm[1]] || '23:59';
  }

  var loc = extractLoc(raw, null);

  var imp = /(重要|必须|务必|截止|deadline|ddl|一定要|不能忘)/i.test(s) ? 3
          : (/(记得|提醒|抽空|方便的话|尽量|有空|不着急|随手)/i.test(s) ? 1 : 2);

  /* 事项名：①书名号《…》 ②整行没脏信息的主行 ③传统清洗兜底 */
  var title = '', bm = s.match(/《([^《》]{2,40})》/);
  if (bm){
    title = bm[1];
    var tailm = s.slice(s.indexOf(bm[0]) + bm[0].length).match(/^\s*(讲座|报告|课程|宣讲会|分享会|比赛|竞赛|会议|考试|答辩|活动)/);
    if (tailm) title += tailm[1];
  }
  if (!title){
    var evn = findEventName(s, loc);
    if (evn) title = evn;
  }
  if (!title){
    var TITLE_DIRTY = /(主讲|主持人|讲师|嘉宾|学分|学时|综测|到场|签到|报名|扫码|进群|二维码|接龙|回复|周知|通知|地点|时间|日期|对象|名额|截止|方式|收到|欢迎|预告|请|群|🙂|👇|·)/;
    var lines2 = String(raw || '').split(/\n/);
    /* ②-a：含「主题 / 标题 / 名称」标签的整行优先级最高 */
    for (var q1 = 0; q1 < lines2.length && !title; q1++){
      var lm = (lines2[q1] || '').match(/(?:活动主题|讲座题目|讲座主题|宣讲主题|主题|标题|名称)\s*[:：]\s*([^\n]{2,40})/);
      if (lm){ title = cleanTitleLine(lm[1]); }
    }
    /* ②-b：找第一行「干净又有内容」的行（排除时间行 / 地点行 / 噪声行） */
    for (var q2 = 0; q2 < lines2.length && !title; q2++){
      var rawLn = (lines2[q2] || '').trim();
      if (!rawLn || rawLn.length > 44) continue;
      if (/^[@【（(]/.test(rawLn)) continue;
      if (/\d{1,2}\s*[:：]\s*\d{2}/.test(rawLn)) continue;
      if (/\d{1,2}\s*月\s*\d{1,2}\s*[日号]/.test(rawLn)) continue;
      var cl = cleanTitleLine(rawLn);
      if (cl.length < 4) continue;
      if (TITLE_DIRTY.test(cl)) continue;
      if (/^(同学们好|各位同学|大家好|小伙伴们|各位|亲们|哈喽|通知|注意|学院|学校|教务处|团委)/.test(cl)) continue;
      if (cl.length <= 6 && /[～~！!，,。：:]$/.test(cl)) continue;
      if (loc && normLoc(cl) === normLoc(loc)) continue;
      if (locLooks(cl)) continue;
      title = cl;
    }
  }
  if (!title){
    var pre = s
      .replace(/@[^\s，,。]*/g, '')
      .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]|[\u2190-\u2BFF\uFE0F\u2600-\u27BF]/g, '')
      .replace(/【[^】]{0,12}】/g, '')
      .replace(/(活动主题|讲座题目|讲座主题|宣讲主题|主题|标题|名称|内容)\s*[:：]?\s*/g, '')
      .replace(/[（(]\s*周[一二三四五六日天]\s*[)）]/g, '')
      .replace(/([下这]?)周([一二三四五六日天])/g, '')
      .replace(/(\d{1,2}\s*月\s*\d{1,2}\s*[日号])/g, '')
      .replace(/(上午|早上|凌晨|中午|下午|晚上|傍晚)/g, '')
      .replace(/(\d{1,2}\s*[:：]\s*\d{2}(?:\s*[-—]\s*\d{1,2}\s*[:：]\s*\d{2})?)/g, '')
      .replace(/(\d{1,2}\s*[点時时]\s*\d{0,2}\s*分?)/g, '')
      .replace(/(?:在|地点\s*[:：]|教室\s*[:：]|于)\s*[^\s，,。;；、]{2,14}/g, '');
    if (loc) pre = pre.split(loc).join(' ');
    pre = pre
      .replace(/(举办|举行|开展|召开|组织|定于|将于|将在|拟定于|确定于)/g, '')
      .replace(/(主讲|主持人|讲师|嘉宾|学分|学时|综测|到场|签到|报名|扫码|进群|二维码|接龙|回复|周知|欢迎|提前|分钟|对象|名额|截止|方式|收到)[^，,。;；、！!？?]*/g, '')
      .replace(/^(请各位同学注意|各位同学注意|请各位同学|各位同学|同学们好|同学们|请注意|请大家|大家好|各位|通知|注意|小伙伴们|亲们|哈喽)[：:，,、～~\s]*/g, '')
      .replace(/^请/, '');
    var segs = pre.split(/[，,。;；、！!？?\n·]+/), bestSeg = '', bestC = 0;
    for (var si = 0; si < segs.length; si++){
      var sg = String(segs[si]).replace(/^[，,、。：:\s「」“”]+/, '').replace(/[，,、。：:\s]+$/, '').trim();
      if (!sg) continue;
      var cjk = (sg.match(/[\u4e00-\u9fa5A-Za-z0-9]/g) || []).length;
      if (cjk < 4) continue;
      /* 加分：像事项名的片段；扣分：像叮嘱 / 物品清单的片段 */
      var sc2 = cjk;
      if (new RegExp(EV_SUFFIX + '$').test(sg)) sc2 += 40;
      if (/^(务必|请|记得|注意|需|须|要|带|携带|自备|准备|提前|复习|建议|避免|按时|各组|大家|老师|同学)/.test(sg)) sc2 -= 25;
      if (/(务必|记得|携带|带上|带好|自备|准备好)/.test(sg)) sc2 -= 12;
      if (sc2 > bestC){ bestC = sc2; bestSeg = sg; }
    }
    if (bestSeg){
      /* 前半段若只是个称呼（含「：」且在 10 字内），丢掉称呼 */
      var cpos = bestSeg.indexOf('：') >= 0 ? bestSeg.indexOf('：') : bestSeg.indexOf(':');
      if (cpos >= 0 && cpos <= 10){
        var tail = bestSeg.slice(cpos + 1).trim();
        if (((tail.match(/[\u4e00-\u9fa5]/g) || []).length) >= 5) bestSeg = tail;
      }
      bestSeg = bestSeg.replace(/^(学院|学校|我部|团委|学生会|研究生院|教务处|学生处|年级|班级)\s*/, '');
      title = bestSeg;
    }
  }
  if (loc) title = title.split(loc).join(' ');
  title = title.replace(/\s{2,}/g, ' ').replace(/^[，,、。：:\s「」“”·]+/, '').replace(/[，,、。：:\s·]+$/, '').trim();
  if (!title) title = s.slice(0, 26);
  title = title.trim().slice(0, 30);

  return { title: title, date: date, time: time, location: loc, note: extractNote(s),
           importance: imp, raw: s };
}

/* —— 文件读取：文本直读；docx 解 zip 里的 document.xml；pdf 尽力抽取 —— */
function fileExtOf(n){ var m = String(n || '').match(/\.([A-Za-z0-9]+)$/); return m ? m[1].toLowerCase() : ''; }
function fmtBytes(n){
  if (!n) return '0 KB';
  return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
}
function readBlob(file, asText){
  return new Promise(function(resolve){
    try {
      var fr = new FileReader();
      fr.onload = function(){ resolve(fr.result); };
      fr.onerror = function(){ resolve(asText ? '' : null); };
      if (asText) fr.readAsText(file, 'utf-8'); else fr.readAsArrayBuffer(file);
    } catch (e){ resolve(asText ? '' : null); }
  });
}
function stripXml(x){
  return String(x || '')
    .replace(/<w:p[ >]/g, '\n')
    .replace(/<w:br\s*\/>/g, '\n')
    .replace(/<\/w:p>/g, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g, '&')
    .replace(/[ \t]{2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
}
function unzipEntry(buf, want){
  var u8 = new Uint8Array(buf), dv = new DataView(buf), i = 0;
  while (i + 30 < u8.length){
    if (dv.getUint32(i, true) !== 0x04034b50){ i++; continue; }
    var method = dv.getUint16(i + 8, true), csize = dv.getUint32(i + 18, true),
        nlen = dv.getUint16(i + 26, true), elen = dv.getUint16(i + 28, true);
    var nm = '', k;
    for (k = 0; k < nlen; k++) nm += String.fromCharCode(u8[i + 30 + k]);
    var start = i + 30 + nlen + elen;
    if (nm === want) return { method: method, data: u8.subarray(start, start + csize) };
    if (!csize) break;
    i = start + csize;
  }
  return null;
}
function inflateRaw(u8){
  if (typeof DecompressionStream === 'undefined' || typeof Response === 'undefined') return Promise.resolve('');
  try {
    var stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).text()['catch'](function(){ return ''; });
  } catch (e){ return Promise.resolve(''); }
}
function pdfLooseText(buf){
  var u8 = new Uint8Array(buf), chunk = '', i;
  var cap = Math.min(u8.length, 400000);
  for (i = 0; i < cap; i++) chunk += String.fromCharCode(u8[i]);
  var out = '', m, re = /\(([^()\\]{2,160})\)\s*Tj/g;
  while ((m = re.exec(chunk))) out += m[1] + '\n';
  return out.replace(/\\([()\\])/g, '$1');
}
function extractFileText(file){
  var ext = fileExtOf(file.name);
  if (ext === 'txt' || ext === 'md' || ext === 'csv' || ext === 'text') return readBlob(file, true);
  if (ext === 'docx'){
    return readBlob(file, false).then(function(buf){
      if (!buf) return '';
      var e = unzipEntry(buf, 'word/document.xml');
      if (!e) return '';
      if (e.method === 0){
        var t = '', i;
        for (i = 0; i < e.data.length; i++) t += String.fromCharCode(e.data[i]);
        return stripXml(t);
      }
      return inflateRaw(e.data).then(stripXml);
    })['catch'](function(){ return ''; });
  }
  if (ext === 'pdf'){
    return readBlob(file, false).then(function(buf){ return buf ? pdfLooseText(buf) : ''; })['catch'](function(){ return ''; });
  }
  return Promise.resolve('');
}

function focusMinutesOn(dateStr){
  var s = 0, lg = DB.focus.logs;
  for (var i = 0; i < lg.length; i++){ if (lg[i].date === dateStr) s += lg[i].minutes; }
  return s;
}
function weekFocusMinutes(){
  var ws = weekStart(today()), s = 0, lg = DB.focus.logs;
  for (var i = 0; i < 7; i++){ s += focusMinutesOn(ymd(addDays(ws, i))); }
  return s;
}
function pendingHomeworks(){
  return DB.homeworks.filter(function(h){ return h.status !== 'done'; })
                     .sort(function(a,b){ return a.deadline < b.deadline ? -1 : 1; });
}

function viewHomework(){
  var all = DB.homeworks.slice().sort(function(a,b){ return a.deadline < b.deadline ? -1 : 1; });
  var pend = all.filter(function(h){ return h.status !== 'done'; });
  var done = all.filter(function(h){ return h.status === 'done'; });

  var h = '';

  h += '<div class="card" style="display:flex;gap:10px;text-align:center;padding:12px">' +
       '<div style="flex:1"><div class="mid" style="color:#EF4444">' + pend.filter(function(x){ return hwDaysLeft(x) < 0; }).length + '</div><div style="font-size:11px;color:#6B7280">逾期</div></div>' +
       '<div style="flex:1;border-left:1px solid #F0F1F5"><div class="mid" style="color:#F59E0B">' + pend.filter(function(x){ var n = hwDaysLeft(x); return n >= 0 && n <= 2; }).length + '</div><div style="font-size:11px;color:#6B7280">3 天内</div></div>' +

       '</div>';

  h += '<div class="sec">待完成 ' + pend.length + ' 项</div>';
  if (!pend.length){
    h += '<div class="card"><div class="empty">' + ic('ok',34,'#10B981',1.5) + '<div>没有待完成作业</div></div></div>';
  } else {
    h += '<div class="card">';
    for (var i = 0; i < pend.length; i++){
      var x = pend[i], late = hwDaysLeft(x) < 0;
      h += '<div class="ci" data-act="nav" data-arg="#/study/homework/' + esc(x.id) + '">' +
           '<div class="bar" style="background:' + (late ? '#EF4444' : impColor(x.importance)) + '"></div>' +

             (x.focusCount ? '<div class="lc" style="color:#10B981">已专注 ' + x.focusCount + ' 次 / 累计 ' + x.focusMin + ' 分钟</div>' : '') +
           '</div>' + hwTag(x) + '</div>';
    }
    h += '</div>';
  }

  if (done.length){
    h += '<div class="sec">已完成 ' + done.length + ' 项</div><div class="card">';
    for (var j = 0; j < done.length; j++){
      var y = done[j];
      h += '<div class="ci" style="opacity:.72" data-act="nav" data-arg="#/study/homework/' + esc(y.id) + '">' +

           '<span class="tag ok">' + ic('check',11,'#047857',2.2) + '完成</span></div>';
    }
    h += '</div>';
  }
  return h;

/* ================= 演示时间（入口只在 Forest 页） ================= */
function nowMs(){
  var d = STATE.demo;
  if (d && d.on) return d.base0 + (Date.now() - d.real0) * (d.speed || 1);
  return Date.now();
}
function nowHM(ms){
  var d = new Date(ms === undefined ? nowMs() : ms);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function demoStart(speed){
  var cur = nowMs();
  STATE.demo = { on:true, speed: speed || 60, base0: cur, real0: Date.now() };
  if (STATE.forest && STATE.forest.running) STATE.forest.startAt = cur;
  toast('演示模式已开启 · ' + (speed || 60) + ' 倍速，现在 ' + nowHM());
}
function demoStop(){
  STATE.demo = { on:false, speed:60, base0:0, real0:0 };
  toast('演示结束，已落回真实时间 ' + nowHM(Date.now()));
}
function demoJump(min){
  var d = STATE.demo;
  if (!d || !d.on){ toast('请先开启演示模式'); return; }
  d.base0 += min * 60000;
  toast('已快进 ' + min + ' 分钟 · 现在 ' + nowHM());
}

  ch[k] = !ch[k]; DB.gate.done = false; save(); showGate();
};
ACTIONS.gateAll = function(){
  var ch = gateChoices();
  for (var i = 0; i < GATE_ITEMS.length; i++) ch[GATE_ITEMS[i].key] = true;
  save(); showGate(); toast('已全部勾选，点「登录并进入」生效');
};
ACTIONS.gateMinimal = function(){
  DB.gate.choices = {};
  for (var k in GATE_MIN){ if (GATE_MIN.hasOwnProperty(k)) DB.gate.choices[k] = GATE_MIN[k]; }
  save(); showGate(); toast('已恢复为「仅必要项」');
};
ACTIONS.gateEnter = function(){
  var ch = gateChoices();
  /* 系统通知走浏览器真实授权 */
  if (ch.notify){
    try {
      if (typeof Notification !== 'undefined' && Notification.permission === 'default'){
        var r = Notification.requestPermission();
        if (r && r.then) r.then(function(p){ DB.remind.sysGranted = (p === 'granted'); save(); });
      } else if (typeof Notification !== 'undefined'){
        DB.remind.sysGranted = (Notification.permission === 'granted');
      }
    } catch (e){ DB.remind.sysGranted = false; }
  } else {
    DB.remind.sysGranted = false;
  }
  DB.billConfig.autoImport = !!ch.autoBill;
  for (var i = 0; i < DB.permissions.length; i++){
    var q = DB.permissions[i];
    if (q.key === 'notify')    q.state = ch.notify ? 'granted' : 'prompt';
    if (q.key === 'file')      q.state = ch.file ? 'granted' : 'prompt';
    if (q.key === 'clipboard') q.state = ch.clipboard ? 'granted' : 'prompt';
    if (q.key === 'album')     q.state = ch.album ? 'granted' : 'prompt';
  }
  DB.gate.done = true;
  DB.gate.at = ymd(today()) + ' ' + nowHM();
  save();
  hideGate();
  render();
  toast('已登录 · 已按同学的选择开通能力');
};

ACTIONS.gateLogout = function(){
  DB.gate.done = false; save(); showGate();
};

function rmdEnabled(){ return !!(DB.remind && DB.remind.inapp); }
function rmdSettings(id){
  if (!DB.remind) DB.remind = { sysGranted:false, inapp:true, settings:{}, logs:[] };
  if (!DB.remind.settings) DB.remind.settings = {};
  var s = DB.remind.settings[id];
  if (!s){ s = DB.remind.settings[id] = { on:true, lead:15 }; }
  return s;
}

function deviceTag(){
  var ua = (typeof navigator !== 'undefined' && navigator.userAgent) ? String(navigator.userAgent) : '';
  if (/iPad|Tablet|Android(?!.*Mobile)/i.test(ua)) return '平板';
  if (/Android|iPhone|Mobile|HarmonyOS/i.test(ua)) return '手机';
