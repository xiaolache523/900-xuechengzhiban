/* ---- 消费守护：日花费提醒值 / 上限 / 家长通知 ---- */
function todaySpend(){
  var d = ymd(today()), s = 0;
  for (var i = 0; i < DB.bills.length; i++){ if (DB.bills[i].date === d) s += DB.bills[i].amount; }
  return Math.round(s * 100) / 100;
}
function spendGuardCheck(){
  var bc = DB.billConfig, d = ymd(today()), s = todaySpend();
  if (s > bc.dayCap){
    if (!bc.locked){
      bc.locked = true; bc.lockedAt = nowHM();
      pushNotice({ type:'家长', title:'消费限制已触发',
        body:'今日已花 ' + yuan(s) + '，超过上限 ' + yuan(bc.dayCap) + '，消费已限制，等待家长解除',
        place:'账单 · 消费守护', href:'#/life/bill' });
      toast('今日花费超过上限，已限制消费并通知家长');
    }
  } else if (s > bc.dayWarn){
    if (bc.warnDay !== d){
      bc.warnDay = d;
      pushNotice({ type:'账单', title:'今日花费提醒',
        body:'今日已花 ' + yuan(s) + '，超过提醒值 ' + yuan(bc.dayWarn) + '（上限 ' + yuan(bc.dayCap) + '）',
        place:'账单 · 消费守护', href:'#/life/bill' });
      toast('今日花费已超过提醒值 ' + yuan(bc.dayWarn));
    }
  }
  save();
}
function pushNotice(o){
  if (!DB.notices) DB.notices = [];
  DB.notices.unshift({
    id: o.id || uid('nt'), type: o.type || '通知', title: o.title, at: o.at || '',
    place: o.place || '', body: o.body || '', date: ymd(today()), fireAt: nowHM(),
    read: false, href: o.href || '#/schedule'
  });
  if (DB.notices.length > 60) DB.notices.length = 60;
}
function todayRemindItems(){
  var td = ymd(today()), dow = dayOfWeek(today()), out = [], i;
  /* 课程 */
  for (i = 0; i < DB.courses.length; i++){
    var c = DB.courses[i];
    if (c.day !== dow) continue;
    out.push({ id:c.id, title:c.title, kind:'课程', at:c.start, place:c.location,
               time:+new Date(td + 'T' + c.start + ':00') });
  }
  /* 作业截止 */
  for (i = 0; i < DB.homeworks.length; i++){
    var hw = DB.homeworks[i];
    if (hw.status === 'done') continue;
    if (String(hw.deadline).slice(0,10) !== td) continue;
    out.push({ id:hw.id, title:hw.title, kind:'截止', at:String(hw.deadline).slice(11), place:hw.subject,
               time:+new Date(td + 'T' + String(hw.deadline).slice(11) + ':00') });
  }
  /* 考试 */
  if (DB.exams) for (i = 0; i < DB.exams.length; i++){
    var ex = DB.exams[i];
    if (String(ex.date).slice(0,10) !== td) continue;
    var exAt = String(ex.time).slice(0, 5);
    out.push({ id:ex.id, title:ex.name, kind:'考试', at:exAt, place:ex.location,
               time:+new Date(td + 'T' + exAt + ':00') });
  }
  /* 已报名的活动（含发布后自动订阅的） */
  if (DB.activities) for (i = 0; i < DB.activities.length; i++){
    var ac = DB.activities[i];
    if (!ac.joined) continue;
    if (String(ac.time).slice(0,10) !== td) continue;
    out.push({ id:ac.id, title:ac.title, kind:'活动', at:String(ac.time).slice(11), place:ac.location,
               time:+new Date(td + 'T' + String(ac.time).slice(11) + ':00') });
  }
  /* 竞赛里程碑 / 赛程节点 */
  if (DB.milestones) for (i = 0; i < DB.milestones.length; i++){
    var ms = DB.milestones[i];
    if (String(ms.at).slice(0,10) !== td) continue;
    out.push({ id:ms.id, title:ms.title, kind:'竞赛', at:String(ms.at).slice(11), place:ms.place,
               time:+new Date(td + 'T' + String(ms.at).slice(11) + ':00') });
  }
  return out.sort(function(a,b){ return a.time - b.time; });
}
function checkReminders(){
  if (!DB || !DB.remind) return;
  if (typeof focusLocked === 'function' && focusLocked()) return;   /* 专注锁屏期间不打扰 */
  var t = nowMs(), items = todayRemindItems(), i, j;
  for (i = 0; i < items.length; i++){
    var it = items[i], s = rmdSettings(it.id);
    if (!s.on) continue;
    var fire = it.time - (s.lead || 15) * 60000;
    if (t < fire || t > fire + 5 * 60000) continue;
    var key = ymd(today()) + '|' + it.id, dup = false;
    for (j = 0; j < DB.remind.logs.length; j++){ if (DB.remind.logs[j].key === key){ dup = true; break; } }
    if (dup) continue;
    fireRemind(it, key);
  }
}
function fireRemind(it, key){
  var body = it.kind + ' · ' + it.at + (it.place ? ' · ' + it.place : '');
  var sys = DB.remind.sysGranted ? sysNotify(it.title, body) : false;
  DB.remind.logs.unshift({ key:key, id:it.id, title:it.title, kind:it.kind, at:it.at,
                           date:ymd(today()), fireAt:nowHM(), sys:sys });
  pushNotice({ id:'rm-' + it.id, type:it.kind, title:it.title, at:it.at, place:it.place,
               body:it.kind + ' · ' + it.at + (it.place ? ' · ' + it.place : '') + '（到点提醒）',
               href: it.kind === '竞赛' ? '#/study/contest' : (it.kind === '活动' ? '#/life/activity' : '#/schedule') });
  if (DB.remind.logs.length > 40) DB.remind.logs.length = 40;
  save();
  showInAppRemind(it, body, sys);
  if (STATE.route && STATE.route.p === '#/schedule') render();
}
function sysNotify(title, body){
  try {
    if (typeof Notification === 'undefined') return false;
    if (Notification.permission !== 'granted') return false;
    new Notification(title, { body: body, tag: 'xc-remind' });
    return true;
  } catch (e){ return false; }
}
function showInAppRemind(it, body, sys){
  var el = document.getElementById('rmdbar');
  if (!el) return;
  el.innerHTML = '<div class="rmd" data-act="rmdGo" data-arg="' + esc(it.id) + '">' +
      '<div class="ri" style="background:#EEF2FF;flex:0 0 34px;width:34px;height:34px">' + ic('bell',18,'#4F46E5') + '</div>' +
      '<div class="rt"><div class="t">' + esc(it.title) + '</div>' +
      '<div class="s">' + esc(body) + '<br>提醒方式：页面内' + (sys ? ' + 系统通知' : '（系统通知未授权）') + '</div></div>' +
      '<div class="x" data-act="rmdClose">关闭</div></div>';
  el.classList.add('on');
  clearTimeout(_rmdBarTimer);
  _rmdBarTimer = setTimeout(function(){ var e2 = document.getElementById('rmdbar'); if (e2) e2.classList.remove('on'); }, 7000);
}

function forestElapsed(){
  var f = STATE.forest;
  if (!f) return 0;
  return f.acc + (f.running && f.startAt ? (nowMs() - f.startAt) : 0);
}

function fmtMS(ms){
  var s = Math.max(0, Math.floor(ms / 1000)), m = Math.floor(s / 60);
  return pad2(m) + ':' + pad2(s % 60);
}
function fmtHMS(ms){
  var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return (h > 0 ? h + ':' + pad2(m) : pad2(m)) + ':' + pad2(s % 60);
}
function forestStage(f, el){
  if (f.mode === 'up'){
    var mi = el / 60000, pct = Math.min(100, mi / 45 * 100);
    if (mi < 5)  return { svg: seedSVG(),    nm: '种子', lb: '阶段一 · 种子', pct: pct };
    if (mi < 15) return { svg: sproutSVG(),  nm: '幼苗', lb: '阶段二 · 幼苗', pct: pct };
    if (mi < 30) return { svg: treeSVG(),    nm: '小树', lb: '阶段三 · 小树', pct: pct };
    return        { svg: bigTreeSVG(), nm: '大树', lb: '阶段四 · 大树', pct: pct };
  }
  var p = f.total ? Math.min(1, el / f.total) : 0;
  return { svg: p < .33 ? seedSVG() : (p < .66 ? sproutSVG() : treeSVG()),
           nm:  p < .33 ? '种子' : (p < .66 ? '幼苗' : '小树'),
           lb:  p < .33 ? '阶段一 · 种子' : (p < .66 ? '阶段二 · 幼苗' : '阶段三 · 小树'),
           pct: p * 100 };
}

/* ---------- 枯萎动画：四个阶段各不相同 ---------- */
function witherSVG(stage){
  if (stage === '种子') return witherSeedSVG();
  if (stage === '幼苗') return witherSproutSVG();
  if (stage === '小树') return witherTreeSVG();
  return witherBigSVG();
}
function soilDust(cx, cy){
  return '<ellipse class="dust" cx="' + cx + '" cy="' + cy + '" rx="7" ry="2.2" fill="#C9B896"/>';
}
function leafSvgs(list, base, step){
  var o = '';
  for (var i = 0; i < list.length; i++){
    o += '<path class="wfb" d="M' + list[i][0] + ' ' + list[i][1] +
         'c5-3 9-1 9 3-4 3-8 2-9-3z" fill="#7FB069" ' +
         'style="animation:wFall ' + (1.6 + (i % 4) * 0.12).toFixed(2) + 's ease-in ' +
         (base + i * step).toFixed(2) + 's forwards"/>';
  }
  return o;
}
function fruitFall(cx, cy, r, fill, delay){
  return '<circle class="wfb" cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill +
         '" style="animation:wDropF 1s ease-in ' + delay + 's forwards"/>' +
         '<ellipse class="wfb" cx="' + cx + '" cy="' + (cy + 46) + '" rx="5" ry="1.7" fill="none" stroke="' + fill +
         '" stroke-width="1.3" style="animation:wRing .8s ease-out ' + (parseFloat(delay) + 0.9).toFixed(2) + 's forwards"/>';
}
function windLines(y, w, delay, dur, color){
  return '<path d="M2 ' + y + 'h' + w + 'M' + (w + 12) + ' ' + (y - 5) + 'h' + (w - 6) +
         '" stroke="' + color + '" stroke-width="1.4" fill="none" stroke-linecap="round" class="wfb" ' +
         'style="animation:wWind ' + dur + 's ease-out ' + delay + 's forwards"/>';
}
function graySky(delay, dur){
  return '<rect class="wfb" x="0" y="0" width="120" height="120" fill="#6F5F47" opacity="0" ' +

/* ---------- 开花结果动画 ---------- */
function flowerG(cx, cy, dly){
  var g = '<g class="b-flower" style="animation-delay:' + dly + 's">';
  for (var i = 0; i < 5; i++){
    var a = i * 72 * Math.PI / 180;
    g += '<circle cx="' + (cx + Math.cos(a) * 3.4).toFixed(1) + '" cy="' + (cy + Math.sin(a) * 3.4).toFixed(1) + '" r="3" fill="#F9A8D4"/>';
  }
  g += '<circle cx="' + cx + '" cy="' + cy + '" r="1.9" fill="#FDE047"/>';
  return g + '</g>';
}
function bloomSVG(stage){
  var base = stage === '大树' ? bigTreeSVG() : (stage === '小树' ? treeSVG() : (stage === '幼苗' ? sproutSVG() : seedSVG()));
  var P = { '大树': { f:[[46,24],[72,22],[58,12],[38,44],[82,42],[60,48]], r:[[52,58],[70,54],[42,32],[78,34]] },
            '小树': { f:[[46,32],[74,30],[60,22],[44,50],[78,48]],        r:[[52,56],[68,52]] },
            '幼苗': { f:[[50,58],[70,58],[60,50]],                        r:[[60,68]] },
            '种子': { f:[[60,56]],                                        r:[[60,66]] } }[stage]
        || { f:[[60,30]], r:[[70,52]] };
  var g = '<circle class="b-glow" cx="60" cy="40" r="38" fill="#A7F3D0"/>';
  if (stage === '种子'){
    g += '<g class="b-sprout"><path d="M60 62V48" stroke="#4FA84F" stroke-width="3" stroke-linecap="round"/>' +
         '<path d="M60 54c-7 0-11-4-11-9 6-1 11 3 11 9z" fill="#6FC971"/></g>';
  }
  for (var i = 0; i < P.f.length; i++) g += flowerG(P.f[i][0], P.f[i][1], (0.35 + i * 0.16).toFixed(2));
  for (var j = 0; j < P.r.length; j++){
    g += '<circle class="b-fruit" style="animation-delay:' + (1.05 + j * 0.16).toFixed(2) + 's" cx="' + P.r[j][0] +
         '" cy="' + P.r[j][1] + '" r="3.2" fill="' + (j % 2 ? '#F59E0B' : '#EF4444') + '"/>';
  }
  return base.replace('</svg>', g + '</svg>');
}

/* ---------- 结果动画层 ---------- */
function showAnimLayer(o){
  var layer = document.getElementById('layer');
  layer.innerHTML =
    '<div class="anim-layer" data-mask="1">' +
      '<div class="anim-card">' +
        '<div class="am">' + o.svg + '</div>' +
        '<div class="at" style="color:' + o.color + '">' + esc(o.title) + '</div>' +
        '<div class="as">' + o.sub + '</div>' +
        '<button class="btn ab" id="animBtn" data-act="closeLayer">' + esc(o.btn) + '</button>' +
        (o.ms ? '<div class="ab-tip">动画播完后自动关闭 · <span id="animCd">' + Math.round(o.ms / 1000) + '</span>s</div>' +
                '<div class="ab-bar" style="animation:wBar ' + (o.ms / 1000).toFixed(2) + 's linear forwards"></div>' : '') +
      '</div>' +
    '</div>';
  STATE.onDialogOk = null;
  clearTimeout(STATE.animTimer);
  /* 双保险：既走事件委托，也直连 click，保证任何环境都能关掉 */
  var btn = document.getElementById('animBtn');
  if (btn) btn.onclick = function(){ closeLayer(); };
  var msk = layer.firstChild;
  if (msk && typeof msk.onclick === 'object') msk.onclick = function(){ closeLayer(); };
  if (o.ms){
    var left = Math.round(o.ms / 1000);
    STATE.animTimer = setInterval(function(){
      left--;
      var cd = document.getElementById('animCd');
      if (left <= 0){ clearInterval(STATE.animTimer); closeLayer(); return; }
      if (cd) cd.textContent = left;
    }, 1000);
  }
}
function showFocusResult(ok, stage, minutes, planMin, task){
  var pct = planMin ? Math.min(999, Math.round(minutes / planMin * 100)) : 100;
  if (ok){
    showAnimLayer({
      svg: bloomSVG(stage),
      title: '开花结果啦！',
      color: '#047857',
      sub: '坚持了 <b style="color:#047857">' + minutes + ' 分钟</b>（' + esc(stage) + '阶段），小树开了花并结出果实，已种进今天的森林。',
      btn: '收下这棵树',
      ms: 4200
    });
  } else {
    showAnimLayer({
      svg: witherSVG(stage),
      title: '小树枯萎了…',
      color: '#B45309',
      sub: '本次专注 <b style="color:#B45309">' + minutes + ' 分钟</b>，只完成 ' + pct + '%，在' + esc(stage) +
           '阶段退出，小树会慢慢枯萎。<br>下次先挑一个能坚持住的时长吧。',
      btn: '知道了',
      ms: 5000
    });
  }
}

/* ---------- 记录页 ---------- */
function miniTreeSVG(stage, dead){
  var t = stage === '大树' ? bigTreeSVG() : (stage === '小树' ? treeSVG() : (stage === '幼苗' ? sproutSVG() : seedSVG()));
  t = t.replace('width="120" height="120"', 'width="36" height="36"');
  return dead ? t.replace('<svg ', '<svg class="mini-gray" ') : t;
}
function viewForestLog(){
  var f = STATE.forest;
  var all = DB.focus.logs.slice().sort(function(a, b){
    var ka = (a.date || '') + (a.at || ''), kb = (b.date || '') + (b.at || '');
    return ka < kb ? 1 : (ka > kb ? -1 : 0);
  });
  var grow = [], dead = [], totalMin = 0;
  for (var i = 0; i < all.length; i++){
    if (all[i].result === 'wither') dead.push(all[i]); else grow.push(all[i]);
    totalMin += (all[i].minutes || 0);
  }
  var rate = all.length ? Math.round(grow.length / all.length * 100) : 0;
  var td = ymd(today()), todayN = 0;
  for (var d = 0; d < all.length; d++){ if (all[d].date === td && all[d].result !== 'wither') todayN++; }

  var h = '';

  h += '<div class="grid3">' +
       '<div class="stat"><div class="n" style="color:#10B981">' + grow.length + '</div><div class="l">种成 / 棵</div></div>' +
       '<div class="stat"><div class="n" style="color:#B45309">' + dead.length + '</div><div class="l">枯萎 / 棵</div></div>' +
       '<div class="stat"><div class="n" style="color:#4F46E5">' + rate + '%</div><div class="l">成活率</div></div>' +
       '</div>';
  h += '<div class="grid3" style="margin-top:8px">' +
       '<div class="stat"><div class="n" style="font-size:16px">' + Math.floor(totalMin / 60) + 'h' + (totalMin % 60) + 'm</div><div class="l">累计专注</div></div>' +
       '<div class="stat"><div class="n">' + DB.focus.streak + '</div><div class="l">连续天数</div></div>' +
       '<div class="stat"><div class="n" style="color:#0EA5E9">' + todayN + '</div><div class="l">今日种成</div></div>' +
       '</div>';

  var flt = f.logFilter || 'all';
  var list = flt === 'grow' ? grow : (flt === 'wither' ? dead : all);
  h += '<div class="sec">全部记录</div><div class="chips" style="margin-bottom:10px">' +
       '<div class="' + (flt === 'all' ? 'on' : '') + '" data-act="logFilter" data-arg="all">全部 ' + all.length + '</div>' +
       '<div class="' + (flt === 'grow' ? 'on' : '') + '" data-act="logFilter" data-arg="grow">种成 ' + grow.length + '</div>' +
       '<div class="' + (flt === 'wither' ? 'on' : '') + '" data-act="logFilter" data-arg="wither">枯萎 ' + dead.length + '</div>' +
       '</div>';

  if (!list.length){
    h += '<div class="card" style="text-align:center;padding:22px 14px">' +
         '<div style="font-size:12px;color:#6B7280;line-height:1.8">这一类还没有记录。<br>回到「专注」页开始一次，就会种下第一棵树。</div>' +
         '<button class="btn sub sm" style="margin-top:12px" data-act="focusTab" data-arg="focus">去专注</button></div>';
    return h;
  }

  h += '<div class="card">';
  for (var k = 0; k < list.length; k++){
    var l = list[k], isDead = l.result === 'wither';
    var stg = l.stage || stageOfMin(l.minutes || 0);
    h += '<div class="row" data-act="logDetail" data-arg="' + esc(l.id) + '">' +
         '<div style="width:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center">' + miniTreeSVG(stg, isDead) + '</div>' +
         '<div class="rt"><div class="t">' + esc(l.task || '自由专注') + '</div>' +
         '<div class="s">' + esc(l.date || '') + (l.at ? ' ' + esc(l.at) : '') + ' · ' + (l.mode === 'up' ? '正计时' : '倒计时') +
         ' · ' + esc(stg) + '阶段</div></div>' +
         '<div class="rv"><span class="tag ' + (isDead ? 'warn' : 'ok') + '">' + (isDead ? '枯萎' : '种成') + '</span>' +
         '<div style="font-size:12px;color:#111827;font-weight:600;margin-top:3px">' + l.minutes + ' 分钟</div></div></div>';
  }
  h += '</div>';

  h += '<div class="sec">规则说明</div><div class="card">' +
       '<div style="font-size:12px;line-height:1.8;color:#4B5563">' +
       '· <b>倒计时</b>：走完设定的时长 → 小树开花结果；中途点「提前结束」→ 枯萎。<br>' +
       '· <b>正计时</b>：累计满 45 分钟（长成大树）结束 → 开花结果；不足 45 分钟结束 → 枯萎。<br>' +
       '· 枯萎动画按退出时的阶段区分：种子会裂开下沉，幼苗叶片变黄掉落，小树树冠褪色果实坠地，大树整棵倾倒并大量落叶。<br>' +
       '· 记录保存在本机，点任意一条可看详情并重播当时的动画。</div></div>';
  return h;
}
function viewForest(){
  var f = STATE.forest;
  if (!f){
    f = STATE.forest = { taskId:'', task:'自由专注', mode:'down', total: 25 * 60000, opts:[15,25,45,60,90], startAt:null, acc:0, running:false, done:false, tab:'focus', logFilter:'all' };
  }
  if (!f.mode) f.mode = 'down';
  if (!f.opts || !f.opts.length) f.opts = [15,25,45,60,90];
  var el = forestElapsed();
  var isUp = f.mode === 'up';
  var st = forestStage(f, el);
  var prog = isUp ? (el % 3600000) / 3600000 : Math.min(1, f.total ? el / f.total : 0);
  var lap = Math.floor(el / 3600000);
  var mainTxt = isUp ? fmtHMS(el) : fmtMS(Math.max(0, f.total - el));
  var subTxt  = isUp
    ? ('已专注 ' + Math.floor(el / 60000) + ' 分钟' + (lap > 0 ? ' · 第 ' + (lap + 1) + ' 圈' : ''))
    : (Math.floor(prog * 100) + '% · ' + st.nm);
  var C = 2 * Math.PI * 88;

  if (f.tab !== 'log') f.tab = 'focus';
  if (!f.logFilter) f.logFilter = 'all';
  var isLog = f.tab === 'log';

  var h = '';

  h += '<div class="seg" style="margin-bottom:12px">' +
       '<div class="' + (isLog ? '' : 'on') + '" data-act="focusTab" data-arg="focus">专注</div>' +
       '<div class="' + (isLog ? 'on' : '') + '" data-act="focusTab" data-arg="log">记录</div></div>';
  if (isLog) return viewForestLog();

  /* 模式切换 */
  h += '<div class="seg" style="margin-bottom:12px">' +
       '<div class="' + (isUp ? '' : 'on') + '" data-act="focusMode" data-arg="down">倒计时</div>' +
       '<div class="' + (isUp ? 'on' : '') + '" data-act="focusMode" data-arg="up">正计时</div></div>';

  if (isUp){
    h += '<div class="card" style="margin-bottom:12px;background:#ECFDF5">' +
         '<div style="display:flex;gap:9px;align-items:flex-start">' +
           '<div class="ri" style="width:34px;height:34px;flex:0 0 34px;background:#D1FAE5">' + ic('clock',18,'#10B981') + '</div>' +

function curMin0(f){ return Math.max(1, Math.round((f && f.total ? f.total : 25 * 60000) / 60000)); }

function startForestTick(){
  clearTimers();
  var id = setInterval(updateForestUI, 500);
  STATE.timers.push(id);
}

function updateForestUI(){
  var f = STATE.forest;
  if (!f) return;
  var el = forestElapsed();
  if (f.mode !== 'up' && f.total && el >= f.total){ finishFocus(false); return; }
  var isUp = f.mode === 'up';
  var prog = isUp ? (el % 3600000) / 3600000 : Math.min(1, f.total ? el / f.total : 0);
  var st = forestStage(f, el);
  var lap = Math.floor(el / 3600000);
  var mainTxt = isUp ? fmtHMS(el) : fmtMS(Math.max(0, f.total - el));
  var subTxt  = isUp
    ? ('已专注 ' + Math.floor(el / 60000) + ' 分钟' + (lap > 0 ? ' · 第 ' + (lap + 1) + ' 圈' : ''))
    : (Math.floor(prog * 100) + '% · ' + st.nm);
  var C = 2 * Math.PI * 88;
  var t = document.getElementById('fTime'), p = document.getElementById('fPct'),
      r = document.getElementById('fRing'), tr = document.getElementById('fTree');
  if (t) t.textContent = mainTxt;
  if (p) p.textContent = subTxt;
  if (r) r.setAttribute('stroke-dashoffset', (C * (1 - prog)).toFixed(1));
  if (tr) tr.innerHTML = st.svg + '<div class="stage-lb">' + st.lb + ' · ' + Math.floor(st.pct) + '%</div>';
  renderLock();
}

ACTIONS.focusMode = function(a){

  if (!f) return;
  if (f.running){ toast('请先结束本次专注再切换模式'); return; }
  f.mode = (a === 'up') ? 'up' : 'down';
  f.acc = 0; f.startAt = null; f.running = false;
  if (f.mode === 'down' && !f.total) f.total = 25 * 60000;
  render();
  toast(f.mode === 'up' ? '已切到正计时，随时结束都会记录' : '已切到倒计时');

ACTIONS.setDur = function(a){
  var f = STATE.forest;
  if (!f) return;
  if (f.running){ toast('请先结束本次专注再切换时长'); return; }
  f.mode = 'down';
  f.total = parseInt(a, 10) * 60000;
  f.acc = 0; f.startAt = null;
  render();
};

ACTIONS.customDur = function(){

ACTIONS.durDelta = function(a){
  var el = document.getElementById('durInput');
  if (!el) return;
  var v = (parseInt(el.value, 10) || 0) + parseInt(a, 10);
  el.value = Math.max(1, Math.min(600, v));
};
ACTIONS.durSet = function(a){
  var el = document.getElementById('durInput');
  if (el) el.value = parseInt(a, 10);
};
ACTIONS.saveCustomDur = function(){
  var el = document.getElementById('durInput');
  var v = parseInt(el ? el.value : 0, 10);
  if (isNaN(v) || v < 1 || v > 600){ toast('请输入 1 - 600 之间的分钟数'); return; }
  var f = STATE.forest;
  if (!f) f = STATE.forest = { taskId:'', task:'自由专注', mode:'down', total:25*60000, opts:[15,25,45,60,90], startAt:null, acc:0, running:false, done:false, tab:'focus', logFilter:'all' };
  f.mode = 'down'; f.total = v * 60000; f.acc = 0; f.startAt = null; f.running = false;
  closeLayer(); render();
  toast('倒计时已设为 ' + v + ' 分钟');
};

ACTIONS.focusToggle = function(){
  var f = STATE.forest;
  if (!f) return;
  if (f.running){
    f.acc += nowMs() - f.startAt;
    f.startAt = null; f.running = false;
    clearTimers();
    render();
    toast('已暂停，计时保留');
  } else {
    f.startAt = nowMs(); f.running = true;
    if (lockEnabled()){ f.lock = true; f.confirm = false; }
    render();
    startForestTick();
    renderLock();
    if (!focusLocked()) toast('开始专注，把手机放远一点');
  }
};

ACTIONS.focusEnd = function(){
  var f = STATE.forest;
  if (!f) return;
  if (!f.acc && !f.running){ toast('还没有开始专注'); return; }
  finishFocus(true);
};

function focusPlanMin(f){
  return f.mode === 'up' ? 45 : Math.max(1, Math.round((f.total || 25 * 60000) / 60000));
}
function focusIsWin(f, el){
  return f.mode === 'up' ? (el >= 45 * 60000) : (el >= (f.total || 0));
}
function finishFocus(manual){
  var f = STATE.forest;
  if (!f) return;
  var el = forestElapsed();
  var minutes = Math.max(1, Math.round(el / 60000));
  clearTimers();
  f.lock = false; f.confirm = false;
  renderLock();
  var st = forestStage(f, el);
  var planMin = focusPlanMin(f);
  var win = focusIsWin(f, el);
  f.running = false; f.done = true; f.acc = 0; f.startAt = null;

  DB.focus.logs.push({ id: uid('f'), minutes: minutes, task: f.task, date: ymd(today()), at: nowHM(),
                       mode: f.mode, result: win ? 'grow' : 'wither', stage: st.nm,
                       planMin: planMin, taskId: f.taskId || '' });
  var x = f.taskId ? hwFind(f.taskId) : null;
  if (x){ x.focusCount = (x.focusCount || 0) + 1; x.focusMin = (x.focusMin || 0) + minutes; }
  /* 更新连续天数 */
  var dates = {};
  for (var i = 0; i < DB.focus.logs.length; i++) dates[DB.focus.logs[i].date] = 1;
  var s2 = 0, d = today();
  while (dates[ymd(d)]){ s2++; d = addDays(d, -1); }
  DB.focus.streak = s2;
  save();
  render();
  showFocusResult(win, st.nm, minutes, planMin, f.task);
}

    updateForestUI();
    startForestTick();
  }
});

function monthTotal(mk){
  var s = 0;
  for (var i = 0; i < DB.bills.length; i++){ if (monthKey(DB.bills[i].date) === mk) s += DB.bills[i].amount; }
  return s;
}
function monthBills(mk){
  return DB.bills.filter(function(b){ return monthKey(b.date) === mk; })
                 .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
}
function catSum(mk){
  var out = [];
  for (var i = 0; i < CATS.length; i++){
    var s = 0;
    for (var j = 0; j < DB.bills.length; j++){
      if (monthKey(DB.bills[j].date) === mk && DB.bills[j].category === CATS[i].key) s += DB.bills[j].amount;
    }
    out.push({ key: CATS[i].key, color: CATS[i].color, value: s });
  }
  return out;
}

function donutSVG(items, total){
  var C = 2 * Math.PI * 46, off = 0;
  var s = '<svg width="118" height="118" viewBox="0 0 120 120" style="transform:rotate(-90deg)">' +
          '<circle cx="60" cy="60" r="46" stroke="#F3F4F6" stroke-width="17" fill="none"/>';
  for (var i = 0; i < items.length; i++){
    var li = total > 0 ? C * items[i].value / total : 0;
    if (li <= 0.4) continue;
    s += '<circle cx="60" cy="60" r="46" stroke="' + items[i].color + '" stroke-width="17" fill="none" ' +
         'stroke-dasharray="' + li.toFixed(2) + ' ' + (C - li).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"/>';
    off += li;
  }
  s += '</svg>';
  return s;
}
function barsSVG(cur){
  var arr = [], max = 1;
  for (var i = 5; i >= 0; i--){
    var k = shiftMonth(cur, -i), v = monthTotal(k);
    arr.push({ k: k, v: v });
    if (v > max) max = v;
  }
  var s = '<svg width="100%" height="138" viewBox="0 0 336 138">';
  for (var j = 0; j < arr.length; j++){
    var x = 14 + j * 53, hh = Math.round(arr[j].v / max * 82), isCur = arr[j].k === cur;
    s += '<rect x="' + x + '" y="' + (98 - hh) + '" width="34" height="' + Math.max(3, hh) + '" rx="5" fill="' + (isCur ? '#4F46E5' : '#C7D2FE') + '"/>';
    s += '<text x="' + (x + 17) + '" y="' + (98 - hh - 6) + '" font-size="10" fill="#374151" text-anchor="middle">' + Math.round(arr[j].v) + '</text>';
    s += '<text x="' + (x + 17) + '" y="116" font-size="11" fill="#6B7280" text-anchor="middle">' + (arr[j].k.slice(5,7) * 1) + '月</text>';
  }
  s += '<line x1="14" y1="99" x2="322" y2="99" stroke="#F0F1F5" stroke-width="1"/>';
  s += '</svg>';
  return s;
}

  return h;

ACTIONS.avatarFile = function(a, input){
  if (typeof FileReader === 'undefined') return;
  var f = input && input.files && input.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type || '')){ toast('请选择图片文件'); return; }
  var rd = new FileReader();
  rd.onload = function(){
    var img = new Image();
    img.onload = function(){
      try {
        var S = 256;
        var cv = document.createElement('canvas');
        cv.width = S; cv.height = S;
        var cx = cv.getContext('2d');
        var side = Math.min(img.width, img.height);
        cx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
        DB.profile.avatar = cv.toDataURL('image/jpeg', 0.82);
      } catch (e){ DB.profile.avatar = String(rd.result || ''); }
      DB.profile.avatarFrom = deviceTag();
      save(); closeLayer(); render();
      toast('头像已更新（' + DB.profile.avatarFrom + '上传）');
    };
    img.onerror = function(){ toast('这张照片读不出来，换一张试试'); };
    img.src = String(rd.result || '');
  };
  rd.readAsDataURL(f);
};

};

function resumePoster(){
  var p = DB.profile, a = DB.achievements;
  var gh = (a && a.gpaHistory) ? a.gpaHistory : [];
  var trend = '', i;
  for (i = 0; i < gh.length; i++){
    var hp = Math.max(12, Math.round(gh[i] / 4 * 24));
    trend += '<div class="c"><i class="' + (i === gh.length - 1 ? 'hi' : '') + '" style="height:' + hp + 'px"></i>' +
             '<span>' + gh[i].toFixed(2) + '</span></div>';

  var arrow = gh.length > 1
    ? '<div class="rsm-arr">↑ ' + (gh[gh.length - 1] - gh[0]).toFixed(2) + ' 绩点提升</div>' : '';

  var aw = [];
  if (a && a.scholarships) for (i = 0; i < a.scholarships.length; i++) aw.push(a.scholarships[i]);
  if (a && a.contests)     for (i = 0; i < a.contests.length; i++)     aw.push(a.contests[i]);

  }
  var sc = (a && a.coreCourses) ? a.coreCourses.slice().sort(function(x, y){ return y.score - x.score; }) : [];
  var scHtml = '';
  for (i = 0; i < sc.length; i++){
    scHtml += '<div class="rsm-sc"><span class="n">' + esc(sc[i].name) + '</span>' +
              '<span class="b"><i style="width:' + sc[i].score + '%"></i></span>' +
              '<span class="v">' + sc[i].score + '</span></div>';
  }
  return '<div class="rsm">' +
    '<div class="rsm-band">' +
      '<div style="min-width:0"><div class="tt">笃学篇 · 学业荣誉墙</div>' +
      '<div class="sb">' + esc(p.school) + ' · ' + esc(p.campus) + ' · 数据来自本地成就库</div></div>' +
      '<div class="lg">大工</div>' +
    '</div>' +
    '<div class="rsm-body">' +

  lines.push('');
  lines.push('【教育经历】');
  for (var i = 0; i < r.edu.length; i++) lines.push(r.edu[i].school + ' ' + r.edu[i].major + '（' + r.edu[i].period + '）');
  lines.push('【校园经历】');

  lines.push('【获奖情况】');
  for (var k = 0; k < r.awards.length; k++) lines.push('· ' + r.awards[k]);
  lines.push('【技能】' + r.skills.join(' / '));
  var text = lines.join('\n');

  try { document.execCommand('copy'); toast('简历文本已复制到剪贴板'); }

function actFind(id){
  for (var i = 0; i < DB.activities.length; i++){ if (DB.activities[i].id === id) return DB.activities[i]; }
  return null;
}
function actDays(a){
  var d = new Date(+String(a.time).slice(0,4), +String(a.time).slice(5,7) - 1, +String(a.time).slice(8,10));
  return Math.round((d - today()) / 86400000);
}
function actBadge(a){
  var n = actDays(a);
  if (n < 0) return '<span class="tag">已结束</span>';
  if (n === 0) return '<span class="tag warn">今天</span>';
  if (n <= 3) return '<span class="tag danger">' + n + ' 天后</span>';
  return '<span class="tag">' + n + ' 天后</span>';
}
function qrSVG(size){
  var s = size || 120, n = 9, cell = s / n, out = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '">';
  out += '<rect width="' + s + '" height="' + s + '" fill="#fff"/>';
  for (var i = 0; i < n; i++){
    for (var j = 0; j < n; j++){
      var corner = (i < 3 && j < 3) || (i < 3 && j > n - 4) || (i > n - 4 && j < 3);
      var on = corner ? ((i === 0 || i === 2 || j === 0 || j === 2) || (i === 1 && j === 1)) : (rnd() > 0.52);
      if (on) out += '<rect x="' + (i * cell).toFixed(2) + '" y="' + (j * cell).toFixed(2) + '" width="' + cell.toFixed(2) + '" height="' + cell.toFixed(2) + '" fill="#111827"/>';
    }
  }
  return out + '</svg>';
}

ACTIONS.contestTab = function(a){ STATE.contest.tab = a; render(); };

ACTIONS.ctTask = function(a){
  var parts = String(a).split('|');
  var c = contestFind(parts[0]);
  if (!c || !c.tasks) return;
  var it = c.tasks[parseInt(parts[1], 10)];
  if (!it) return;
  it.done = !it.done;
  var dn = taskDone(c);
  c.progress = c.tasks.length ? Math.round(dn / c.tasks.length * 100) : 0;
  save(); render();
  toast(it.done ? '已完成：' + it.t : '已取消：' + it.t);
};

/* ---------- 学习 · 考试智能助手 ---------- */
function examFind(id){
  for (var i = 0; i < DB.exams.length; i++){ if (DB.exams[i].id === id) return DB.exams[i]; }
  return null;
}
function daysTo(dateStr){
  var d = parseYmd(dateStr);
  return Math.round((d - today()) / 86400000);
}
function copyText(txt){
  var ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('已复制：' + txt); }
  catch (e){ toast('复制失败，请长按手动复制'); }
  document.body.removeChild(ta);
}

  return h;

ACTIONS.examToSchedule = function(){
  var n = 0;
  for (var i = 0; i < DB.exams.length; i++){
    var e = DB.exams[i];

    DB.homeworks.push({
      id: e.id, title: e.name + '（考试）', subject: '考试', deadline: e.date + 'T' + e.time.slice(0,5),
      importance: 3, status: 'pending', files: [], note: '考试地点：' + e.location,

function scoreColor(v){ return v >= 90 ? '#10B981' : (v >= 85 ? '#4F46E5' : (v >= 80 ? '#F59E0B' : '#EF4444')); }
function gpaSpark(arr){
  var d = arr || [];
  var n = d.length;
  if (!n) return '';
  var W = 300, H = 104, padL = 30, padR = 14, padT = 12, padB = 24;
  var max = 4.0, min = 2.8;
  var px = function(i){ return n === 1 ? (padL + (W - padL - padR) / 2) : padL + (W - padL - padR) * i / (n - 1); };
  var py = function(v){ return padT + (H - padT - padB) * (1 - (v - min) / (max - min)); };
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block">';
  var gs = [4.0, 3.5, 3.0];
  for (var g = 0; g < gs.length; g++){
    var gy = py(gs[g]);
    svg += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '" stroke="#F0F1F5" stroke-width="1"/>';
    svg += '<text x="0" y="' + (gy + 3.5).toFixed(1) + '" font-size="9" fill="#9CA3AF">' + gs[g].toFixed(1) + '</text>';
  }
  var line = '', area = '';
  for (var i = 0; i < n; i++){
    var x = px(i), y = py(d[i]);
    line += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    area += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  area += ' L' + px(n - 1).toFixed(1) + ' ' + py(min).toFixed(1) + ' L' + px(0).toFixed(1) + ' ' + py(min).toFixed(1) + ' Z';
  svg += '<path d="' + area + '" fill="#4F46E5" opacity="0.10"/>';
  svg += '<path d="' + line + '" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
  for (var j = 0; j < n; j++){
    var cx = px(j), cy = py(d[j]);
    svg += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="3.6" fill="#fff" stroke="#4F46E5" stroke-width="2.2"/>';
    svg += '<text x="' + cx.toFixed(1) + '" y="' + (cy - 8).toFixed(1) + '" font-size="10" font-weight="700" fill="#4F46E5" text-anchor="middle">' + d[j].toFixed(2) + '</text>';
    svg += '<text x="' + cx.toFixed(1) + '" y="' + (H - 7) + '" font-size="9" fill="#9CA3AF" text-anchor="middle">大' + ['一上', '一下', '二上', '二下', '三上', '三下'][j] + '</text>';
  }
  svg += '</svg>';
  return svg;
}

       '<div style="height:8px;border-radius:999px;background:#F3F4F6;overflow:hidden;margin-top:7px">' +
         '<div style="height:100%;width:' + cp + '%;background:linear-gradient(90deg,#6366F1,#4F46E5)"></div></div>' +
       '<button class="btn sub sm" style="margin-top:11px" data-act="editAcad">' + ic('edit',15,'#374151',2) + ' 编辑绩点与排名</button>' +
       '</div>';

  /* ---------- 绩点趋势 ---------- */
  h += '<div class="sec">绩点趋势</div><div class="card">' +
       '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
         '<div style="font-size:13px;font-weight:700">近三学期</div>' +
         '<span class="tag ok">较上学期 +' + (a.gpaHistory[a.gpaHistory.length - 1] - a.gpaHistory[a.gpaHistory.length - 2]).toFixed(2) + '</span>' +
       '</div>' +
       gpaSpark(a.gpaHistory) +
       '<div style="font-size:11px;color:#6B7280;margin-top:6px;line-height:1.7">绩点按学期累计计算，用于智能规划的难度推荐与目标拆解；数据仅保存在本机。</div>' +
       '</div>';

  /* ---------- 核心课程 ---------- */
  h += '<div class="sec">核心课程成绩</div><div class="card">';
  var sum = 0;
  for (var ci = 0; ci < a.coreCourses.length; ci++){
    var c = a.coreCourses[ci];
    sum += c.score * c.credit;
    h += '<div style="padding:9px 0;border-bottom:' + (ci === a.coreCourses.length - 1 ? 'none' : '1px solid #F0F1F5') + '">' +
         '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">' +
           '<span style="font-size:13px;font-weight:600;flex:1;min-width:0">' + esc(c.name) + '</span>' +
           '<span class="tag">' + c.credit + ' 学分</span>' +
           '<span style="font-size:14px;font-weight:800;color:' + scoreColor(c.score) + ';width:34px;text-align:right">' + c.score + '</span>' +
         '</div>' +
         '<div style="height:6px;border-radius:999px;background:#F3F4F6;overflow:hidden;margin-top:6px">' +
           '<div style="height:100%;width:' + c.score + '%;background:' + scoreColor(c.score) + '"></div></div>' +
         '</div>';
  }
  var tw = 0;
  for (var cw = 0; cw < a.coreCourses.length; cw++) tw += a.coreCourses[cw].credit;
  h += '<div class="kv" style="margin-top:6px;border-top:1px solid #F0F1F5;padding-top:9px"><span>已录 ' + a.coreCourses.length + ' 门 · ' + tw + ' 学分</span><b>加权 ' + (sum / tw).toFixed(1) + '</b></div>' +
       '</div>';

  /* ---------- 竞赛获奖 ---------- */
  h += '<div class="sec">竞赛获奖（' + a.contestList.length + ' 项）</div><div class="card">';
  for (var k = 0; k < a.contestList.length; k++){
    var w = a.contestList[k];
    var lv = w.level === '国家级' ? 'danger' : (w.level === '省级' ? 'main' : 'info');
    h += '<div class="row" data-act="awardDetail" data-arg="' + k + '">' +
         '<div class="ri" style="background:#FEF3C7">' + ic('trophy',19,'#F59E0B') + '</div>' +
         '<div class="rt"><div class="t">' + esc(w.name) + '</div>' +
         '<div class="s">' + esc(w.date) + ' · ' + esc(w.role) + '</div></div>' +
         '<div class="rv"><span class="tag ' + lv + '">' + esc(w.award) + '</span>' +
         '<div style="font-size:11px;color:#6B7280;margin-top:3px">' + esc(w.level) + '</div></div></div>';
  }
  h += '</div>';

  /* ---------- 实习 / 科研经历 ---------- */
  h += '<div class="sec">实习与科研经历</div><div class="card">';
  for (var m = 0; m < a.internships.length; m++){
    var it = a.internships[m];
    h += '<div class="row" data-act="internDetail" data-arg="' + m + '">' +
         '<div class="ri" style="background:#DBEAFE">' + ic('flask',19,'#3B82F6') + '</div>' +
         '<div class="rt"><div class="t">' + esc(it.org) + '</div>' +
         '<div class="s">' + esc(it.role) + ' · ' + esc(it.period) + '</div></div>' +
         '<div class="rv">' + ic('chev',14,'#D1D5DB') + '</div></div>';
  }
  h += '</div>';

  /* ---------- 荣誉与技能 ---------- */
  h += '<div class="sec">奖学金与荣誉</div><div class="card"><div style="display:flex;gap:7px;flex-wrap:wrap">';
  for (var q = 0; q < a.scholarships.length; q++) h += '<span class="tag warn">' + ic('medal',11,'#B45309',2.2) + esc(a.scholarships[q]) + '</span>';
  h += '</div></div>';
  h += '<div class="sec">技能标签</div><div class="card"><div style="display:flex;gap:7px;flex-wrap:wrap">';
  for (var sk = 0; sk < a.skills.length; sk++) h += '<span class="tag main">' + esc(a.skills[sk]) + '</span>';
  h += '</div></div>';

  /* ---------- 隐私设置 ---------- */
  h += '<div class="sec">AI 数据使用设置</div><div class="card">';
  var items = [['planUse','用成绩与专注数据做智能规划','关闭后规划只基于同学手填的信息'],
               ['focusStat','把专注数据用于统计与激励','关闭后不参与任何排行与统计'],
               ['chatAnalyze','允许分析粘贴的聊天记录','仅端侧解析，不上传原文'],
               ['anonShare','匿名化后用于模型优化','可随时关闭，关闭后不再贡献']];
  for (var i = 0; i < items.length; i++){
    var kk = items[i][0];
    h += '<div class="row" style="cursor:default">' +
         '<div class="rt"><div class="t">' + esc(items[i][1]) + '</div><div class="s">' + esc(items[i][2]) + '</div></div>' +
         '<div class="sw' + (pv[kk] ? ' on' : '') + '" data-act="togglePrivacy" data-arg="' + kk + '"><i></i></div></div>';
  }
  h += '</div>';

  /* ---------- 使用教程 ---------- */
  h += '<div class="sec">新手使用教程（视频演示）</div>';
  var tuts = [['3 分钟：把课表接进来','学程导入：粘贴 JSON / 选文件 / 扫码三种方式','#4F46E5','#EEF2FF','down'],
              ['2 分钟：用专注森林搞定一次复习','从作业详情一键开始专注，结束后自动回写','#10B981','#D1FAE5','tree'],
              ['2 分钟：记一笔并看懂消费结构','账单页的环形图、柱状图与预算提醒','#06B6D4','#CFFAFE','wallet']];
  for (var j = 0; j < tuts.length; j++){
    h += '<div class="card" style="margin-bottom:10px;cursor:pointer" data-act="openTut" data-arg="' + j + '">' +
         '<div style="display:flex;align-items:center;gap:10px">' +
         '<div class="ri" style="background:' + tuts[j][3] + '">' + ic(tuts[j][4],19,tuts[j][2]) + '</div>' +
         '<div class="rt"><div class="t">' + esc(tuts[j][0]) + '</div><div class="s">' + esc(tuts[j][1]) + '</div></div>' +
         '<div style="flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#111827;display:flex;align-items:center;justify-content:center">' +
           ic('chev',16,'#fff',2.2) + '</div></div></div>';
  }

  /* ---------- 相关入口 ---------- */
  h += '<div class="sec">相关入口</div><div class="card">' +
       '<div class="row" data-act="nav" data-arg="#/me/resume"><div class="ri" style="background:#EDE9FE">' + ic('medal',19,'#8B5CF6') + '</div>' +
       '<div class="rt"><div class="t">我的简历</div><div class="s">按上面的经历一键生成</div></div>' +
       '<div class="rv">' + ic('chev',14,'#D1D5DB') + '</div></div>' +
       '<div class="row" data-act="nav" data-arg="#/study/achievement"><div class="ri" style="background:#FEF3C7">' + ic('trophy',19,'#F59E0B') + '</div>' +
       '<div class="rt"><div class="t">成就与能力画像</div><div class="s">证书、志愿时长与能力雷达</div></div>' +
       '<div class="rv">' + ic('chev',14,'#D1D5DB') + '</div></div>' +
       '<div class="row" data-act="nav" data-arg="#/me"><div class="ri" style="background:#F3F4F6">' + ic('shield',19,'#6B7280') + '</div>' +
       '<div class="rt"><div class="t">权限清单与数据管理</div><div class="s">七项权限状态、重置演示数据</div></div>' +
       '<div class="rv">' + ic('chev',14,'#D1D5DB') + '</div></div>' +
       '</div>';
  return h;
}

ACTIONS.editProfile = function(){
  var p = DB.profile;
  openSheet('编辑学籍信息',
    '<div class="fld"><label>姓名</label><input class="inp" id="pfName" value="' + esc(p.name) + '"></div>' +
    '<div class="fld"><label>学校</label><input class="inp" id="pfSchool" value="' + esc(p.school) + '"></div>' +
    '<div class="fld"><label>校区</label><input class="inp" id="pfCampus" value="' + esc(p.campus) + '"></div>' +
    '<div class="fld"><label>专业</label><input class="inp" id="pfMajor" value="' + esc(p.major) + '"></div>' +
    '<div class="fld"><label>年级</label><input class="inp" id="pfGrade" value="' + esc(p.grade) + '"></div>' +
    '<div class="fld"><label>宿舍</label><input class="inp" id="pfDorm" value="' + esc(p.dorm) + '"></div>' +
    '<button class="btn" data-act="saveProfile">保存</button>' +
    '<div style="height:10px"></div><button class="btn sub" data-act="closeLayer">取消</button>');
};
ACTIONS.saveProfile = function(){
  var p = DB.profile;
  p.name = document.getElementById('pfName').value.trim() || p.name;
  p.school = document.getElementById('pfSchool').value.trim() || p.school;
  p.campus = document.getElementById('pfCampus').value.trim() || p.campus;
  p.major = document.getElementById('pfMajor').value.trim() || p.major;
  p.grade = document.getElementById('pfGrade').value.trim() || p.grade;
  p.dorm = document.getElementById('pfDorm').value.trim() || p.dorm;
  save(); closeLayer(); render(); toast('学籍信息已保存');
};
ACTIONS.editAcad = function(){
  var a = DB.achievements;
  openSheet('编辑绩点与排名',
    '<div class="fld"><label>平均绩点（0 - 4.0）</label><input class="inp" id="acGpa" type="number" step="0.01" value="' + a.gpa + '"></div>' +
    '<div class="fld"><label>专业排名</label><input class="inp" id="acRank" value="' + esc(a.rank) + '"></div>' +
    '<div class="fld"><label>排名百分比</label><input class="inp" id="acPct" value="' + esc(a.rankPct) + '"></div>' +
    '<div class="fld"><label>已修学分</label><input class="inp" id="acCredit" type="number" value="' + a.credits + '"></div>' +
    '<div style="font-size:11px;color:#6B7280;line-height:1.7">修改后，智能规划的目标拆解与难度推荐会同步更新。</div>' +
    '<div style="height:10px"></div>' +
    '<button class="btn" data-act="saveAcad">保存</button>' +
    '<div style="height:10px"></div><button class="btn sub" data-act="closeLayer">取消</button>');
};
ACTIONS.saveAcad = function(){
  var a = DB.achievements;
  var g = parseFloat(document.getElementById('acGpa').value);
  var cr = parseInt(document.getElementById('acCredit').value, 10);
  if (!isNaN(g)) a.gpa = Math.max(0, Math.min(4, g));
  a.rank = document.getElementById('acRank').value.trim() || a.rank;
  a.rankPct = document.getElementById('acPct').value.trim() || a.rankPct;
  if (!isNaN(cr)) a.credits = Math.max(0, cr);
  save(); closeLayer(); render(); toast('学业信息已更新');
};
ACTIONS.awardDetail = function(i){
  var w = DB.achievements.contestList[parseInt(i, 10)];
  if (!w) return;
  openDialog(w.name,
    '<div style="text-align:left;line-height:1.8;font-size:13px">' +
    '奖项：' + esc(w.award) + '<br>级别：' + esc(w.level) + '<br>时间：' + esc(w.date) + '<br>角色：' + esc(w.role) + '</div>' +
    '<div style="text-align:left;font-size:12px;color:#4B5563;line-height:1.7;margin-top:10px;background:#F5F6FA;border-radius:12px;padding:11px 12px">' + esc(w.detail) + '</div>' +
    '<div style="font-size:11px;color:#6B7280;margin-top:10px">该奖项已同步到「我的简历 → 获奖情况」。</div>' +
    (w.docId ? docLink('study', w.docId) : ''),
    '去生成简历',
    function(){ nav('#/me/resume'); });
};
ACTIONS.internDetail = function(i){
  var it = DB.achievements.internships[parseInt(i, 10)];
  if (!it) return;
  openDialog(it.org,
    '<div style="text-align:left;line-height:1.8;font-size:13px">' +
    '岗位：' + esc(it.role) + '<br>时间：' + esc(it.period) + '</div>' +
    '<div style="text-align:left;font-size:12px;color:#4B5563;line-height:1.7;margin-top:10px;background:#F5F6FA;border-radius:12px;padding:11px 12px">' + esc(it.detail) + '</div>',
    '知道了');
};
ACTIONS.verifyName = function(){
  if (DB.profile.verified){
    openDialog('学信网核验信息',
      '<div style="text-align:left;line-height:1.8">姓名：' + esc(DB.profile.realName || DB.profile.name) + '<br>' +
      '学校：' + esc(DB.profile.school) + '<br>学籍状态：在读（本科）<br>核验时间：2026-09-02</div>',
      '知道了');
    return;
  }
  openDialog('学信网实名核验',
    '将跳转学信网官方页面完成学籍核验。<br><br><span style="color:#B45309">演示说明：本原型不真实调取学信网数据，仅演示核验通过后的状态。</span>',
    '模拟核验通过',
    function(){
      DB.profile.verified = true;
      DB.profile.realName = DB.profile.name;
      save(); render(); toast('已完成实名核验');
    });
};
ACTIONS.togglePrivacy = function(k){
  DB.privacy[k] = !DB.privacy[k];
  save(); render();
  toast(DB.privacy[k] ? '已开启' : '已关闭');
};
ACTIONS.openTut = function(i){
  var t = [
    ['把课表接进来', ['打开日程页 → 点右上角「导入」', '选择「粘贴 JSON」或「选择文件」', '点「解析并校验」，逐条核对', '确认后写入本地日历']],
    ['用专注森林搞定一次复习', ['学习页 → 作业 → 进详情', '点「开始专注」，可选倒计时或正计时', '倒计时时长可自选，也能自定义任意分钟', '树苗会随进度从种子长成大树', '结束后回写作业与学习首页']],
    ['记一笔并看懂消费结构', ['生活页 → 账单 → 记一笔', '填金额、选分类、写备注', '环形图看占比，柱状图看趋势', '超预算时进度条会变红']]
  ][parseInt(i, 10)];
  if (!t) return;
  var body = '<div style="text-align:left;line-height:1.9;font-size:13px">';
  for (var s = 0; s < t[1].length; s++){
    body += '<div style="display:flex;gap:8px"><span style="color:#4F46E5;font-weight:700">' + (s + 1) + '.</span><span>' + esc(t[1][s]) + '</span></div>';
  }
  body += '</div><div style="font-size:11px;color:#6B7280;margin-top:10px">视频教程由学校侧录制后挂载，这里给出文字版步骤。</div>';
  openDialog(t[0], body, '开始照着做', function(){ nav('#/schedule'); });
};
